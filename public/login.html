<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>Login</title>
        <style>
            body{
                font-family: Arial, sans-serif;
                max-width: 400px;
                margin: 50px auto;
                padding: 20px;
            }

            form{
                background: #f4f4f4;
                padding: 20px;
                border-radius: 8px;
            }

            input[type="text"], input[type="password"]{
                width: 100%;
                padding: 8px;
                margin: 5px 0;
                box-sizing: border-box;
            }

            input[type="text"]:focus, input[type="password"]:focus{
                /* light pink */
                background-color: #FFD1DC ;
                border: 3px solid #555;
            }


            input[type="submit"]{
                background: #4CAF50;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                display: block;
                margin: 0 auto;
                text-align: center;
            }

            p{
                font-size: small;
            }

            .caps-lock-warning{
                color: blue;
                padding: 8px 12px;
                border-radius: 4px;
                font-size: 14px;
                margin-top: 5px;
                display: none;
                font-size: small;
            }

            /* theme toggle button */
            .theme-toggle{
                position: fixed;
                top: 20px;
                right: 20px;
                background: #f0f0f0;
                border: 2px solid #ddd;
                border-radius: 25px;
                width: 80px;
                height: 35px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 14px;
                font-weight: bold;
                transition: all 0.3s ease;
                z-index: 1002;
                color: #333;
            }

            .theme-toggle:hover{
                background: #e0e0e0;
                transform: scale(1.05);
            }

            /* dark mode styles */
            body.dark-mode{
                background-color: #1a1a1a;
                color: #e0e0e0;
            }

            body.dark-mode form{
                background: #2d2d2d;
                color: #e0e0e0;
            }

            body.dark-mode input[type="text"],
            body.dark-mode input[type="password"],
            body.dark-mode input[type="email"]{
                background: #1a1a1a;
                border-color: #555;
                color: #e0e0e0;
            }

            body.dark-mode input[type="text"]:focus,
            body.dark-mode input[type="password"]:focus,
            body.dark-mode input[type="email"]:focus{
                background-color: #2d2d2d;
                border-color: #777;
            }

            body.dark-mode .theme-toggle{
                background: #2d2d2d;
                border-color: #555;
                color: #e0e0e0;
            }

            body.dark-mode .theme-toggle:hover{
                background: #3d3d3d;
            }

            body.dark-mode a{
                color: #66b3ff;
            }

            body.dark-mode .caps-lock-warning{
                color: #66b3ff;
            }

            /* password visibility toggle */
            .password-container{
                position: relative;
                display: inline-block;
                width: 100%;
            }

            .password-toggle{
                position: absolute;
                right: 10px;
                top: 50%;
                transform: translateY(-50%);
                cursor: pointer;
                font-size: 18px;
                color: #666;
                user-select: none;
            }

            .password-toggle:hover{
                color: #333;
            }

            body.dark-mode .password-toggle{
                color: #ccc;
            }

            body.dark-mode .password-toggle:hover{
                color: #fff;
            }
        </style>
    </head>
    <body>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle dark mode">
            <span id="themeIcon">🌙</span>
        </button>
        <form action="/login" method="POST" autocomplete="on">
            <label for="username">Username: </label>
            <input type="text" id="username" name="username" placeholder="Your username" required><br><br>

            <label for="password">Password: </label>
            <div class="password-container">
                <input type="password" id="password" name="password" placeholder="Your password" required>
                <span class="password-toggle" onclick="togglePasswordVisibility('password', this)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                </span>
            </div>
            <div id="capsLockWarning" class="caps-lock-warning">Notice: Caps Lock is ON</div><br>

            <input type="checkbox" id="rememberMe" name="rememberMe" value="true">
            <label for="rememberMe">remember me</label><br><br><br>

            <input type="submit" value="login">
        </form><br>

        <p>New to ShaniknJewls? <a href="/register.html">Register here</a></p>
        <!-- display the error (after the form, right before the script)-->
        <div id="error" style="color: red; display: none;"></div>
    <script>
            // catch if caps Lock is on 
            const passwordInput = document.getElementById('password');
            const capsLockWarning = document.getElementById('capsLockWarning');

            function checkCapsLock(event) {
                if (event.getModifierState('CapsLock')) {
                    capsLockWarning.style.display = 'block';
                } else {
                    capsLockWarning.style.display = 'none';
                }
            }

            passwordInput.addEventListener('keyup', checkCapsLock);
            passwordInput.addEventListener('keydown', checkCapsLock);
            passwordInput.addEventListener('focus', checkCapsLock);

            // hide warning when password field loses focus
            passwordInput.addEventListener('blur', function() {
                capsLockWarning.style.display = 'none';
            });

            // on page load - check if username was saved and initialize theme
            window.onload = function() {
                const savedUsername = localStorage.getItem('rememberedUsername');
                if (savedUsername) {
                    document.getElementById('username').value = savedUsername;
                    document.getElementById('rememberMe').checked = true;
                }
                initializeTheme();
            };

            // Dark mode functionality
            function initializeTheme() {
                const savedTheme = localStorage.getItem('theme');
                const themeIcon = document.getElementById('themeIcon');

                if (savedTheme === 'dark') {
                    document.body.classList.add('dark-mode');
                    themeIcon.textContent = '☀️';
                } else {
                    themeIcon.textContent = '🌙';
                }
            }

            function toggleTheme() {
                const body = document.body;
                const themeIcon = document.getElementById('themeIcon');

                body.classList.toggle('dark-mode');

                if (body.classList.contains('dark-mode')) {
                    localStorage.setItem('theme', 'dark');
                    themeIcon.textContent = '☀️';
                } else {
                    localStorage.setItem('theme', 'light');
                    themeIcon.textContent = '🌙';
                }
            }

            // Password visibility toggle
            function togglePasswordVisibility(inputId, toggleElement) {
                const passwordInput = document.getElementById(inputId);
                const svg = toggleElement.querySelector('svg');

                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    // switch to eye-slash (eye with diagonal line) icon
                    svg.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07" stroke="currentColor" stroke-width="2"/>';
                } else {
                    passwordInput.type = 'password';
                    // switch back to regular eye icon
                    svg.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
                }
            }

            document.querySelector('form').addEventListener('submit', function(event){
            // "prevent default" so i can use my own fetch() function to decide what happens on form submission
            event.preventDefault();
            // get form data
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // checking if the box is checked to tell the server what is the cookie duration (short/long)
            const remember = document.getElementById('rememberMe').checked;

            // save or remove username (based on 'remember me' checkbox)
            if (remember) {
                localStorage.setItem('rememberedUsername', username);
            } else {
                localStorage.removeItem('rememberedUsername');
            }

            // send POST request to the server
            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json'}, // tells server im sending JSON formated data (just a label)
                body: JSON.stringify({ username, password, remember }) // the data im sending (i saved it earlier in these elements)
            })

            /** fetch() returns a *promise*, not immidiate results (the network requests take time)
             *  ".then" is used to set what happens when the request finishes
             *
             *  1)fetch data=> 2)THEN convert to json=> 3)THEN handle the response
            */

            // handle server response
            .then(response=> response.json())
            .then(data=> {
                if(data.success){
                    // redirects user to store screen on form submission success
                    window.location.href= data.redirect || '/store.html';
                }
                else{
                    // presents an error message on form submission fail (missing field...)
                    document.getElementById('error').style.display = 'block';
                    document.getElementById('error').textContent = data.message;
                }
            })

            // handle errors
            .catch(error=> {
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Connection error. Please try again.';
            });
        });
    </script>
    </body>
</html>
