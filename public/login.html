<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>Login - ShanikJewels</title>
        <!-- Font Awesome for icons <3 -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&display=swap">
        <link rel="stylesheet" href="/styles/theme.css">
    </head>
    <body>
        <!-- header with navigation -->
        <div class="header-shell">
            <div class="announcement-bar">
                <span class="announcement-pill"><i class="fa-solid fa-truck"></i> Free Shipping</span>
                <span>Complimentary express delivery on every order.</span>
                <button type="button" class="announcement-action" onclick="window.location.href='/store.html'">Shop Now <i class="fa-solid fa-arrow-right"></i></button>
            </div>
            <div class="header">
                <button class="menu" id="menu" onclick="toggleMenu()" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
                <div class="brand">
                    <h1>ShanikJewels</h1>
                    <span class="brand-tagline">Handcrafted Jewelry</span>
                </div>
                <div class="header-actions">
                    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle dark mode">
                        <span id="themeIcon">🌙</span>
                        <span id="themeText">OFF</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Side menu -->
        <div class="menu-overlay" id="menuOverlay"></div>
        <nav class="side-menu" id="sideMenu">
            <!-- Dynamic navigation will be populated by JavaScript -->
        </nav>

        <main class="page-frame">
            <div class="auth-container">
                <div class="auth-card">
                    <h1 class="auth-title">Login</h1>
                    <p class="auth-subtitle">New to ShanikJewels? <a href="/register.html">Register here</a></p>

                    <form class="auth-form" action="/login" method="POST" autocomplete="on">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" name="username" placeholder="Your username" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="password-container">
                                <input type="password" id="password" name="password" placeholder="Your password" required>
                                <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password', this)">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                            <div id="capsLockWarning" class="caps-lock-warning">Notice: Caps Lock is ON</div>
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="rememberMe" name="rememberMe" value="true">
                            <label for="rememberMe">Remember me</label>
                        </div>

                        <button type="submit" class="cta-btn primary">Login</button>
                    </form>

                    <!-- Error message -->
                    <div id="error" class="error" style="display: none;"></div>
                </div>
            </div>
        </main>
    <script src="/scripts/layout.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initializeBaseLayout();
        });

        // catch if caps Lock is on 
            const passwordInput = document.getElementById('password');
            const capsLockWarning = document.getElementById('capsLockWarning');

            function checkCapsLock(event) {
                if (event.getModifierState('CapsLock')) {
                    capsLockWarning.style.display = 'block';
                } else {
                    capsLockWarning.style.display = 'none';
                }
            }

            passwordInput.addEventListener('keyup', checkCapsLock);
            passwordInput.addEventListener('keydown', checkCapsLock);
            passwordInput.addEventListener('focus', checkCapsLock);

            // hide warning when password field loses focus
            passwordInput.addEventListener('blur', function() {
                capsLockWarning.style.display = 'none';
            });

            // on page load - check if username was saved
            window.onload = function() {
                const savedUsername = localStorage.getItem('rememberedUsername');
                if (savedUsername) {
                    document.getElementById('username').value = savedUsername;
                    document.getElementById('rememberMe').checked = true;
                }
            };

            // password visibility toggle
            function togglePasswordVisibility(inputId, toggleElement) {
                const passwordInput = document.getElementById(inputId);
                const icon = toggleElement.querySelector('i');

                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    icon.className = 'fa-regular fa-eye-slash';
                } else {
                    passwordInput.type = 'password';
                    icon.className = 'fa-regular fa-eye';
                }
            }

            document.querySelector('form').addEventListener('submit', function(event){
            // "prevent default" so i can use my own fetch() function to decide what happens on form submission
            event.preventDefault();
            // get form data
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // checking if the box is checked to tell the server what is the cookie duration (short/long)
            const remember = document.getElementById('rememberMe').checked;

            // save or remove username (based on 'remember me' checkbox)
            if (remember) {
                localStorage.setItem('rememberedUsername', username);
            } else {
                localStorage.removeItem('rememberedUsername');
            }

            // send POST request to the server
            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json'}, // tells server im sending JSON formated data (just a label)
                body: JSON.stringify({ username, password, remember }) // the data im sending (i saved it earlier in these elements)
            })

            /** fetch() returns a *promise*, not immidiate results (the network requests take time)
             *  ".then" is used to set what happens when the request finishes
             *
             *  1)fetch data=> 2)THEN convert to json=> 3)THEN handle the response
            */

            // handle server response
            .then(response=> response.json())
            .then(data=> {
                if(data.success){
                    // redirects user to store screen on form submission success
                    window.location.href= data.redirect || '/store.html';
                }
                else{
                    // presents an error message on form submission fail (missing field...)
                    document.getElementById('error').style.display = 'block';
                    document.getElementById('error').textContent = data.message;
                }
            })

            // handle errors
            .catch(error=> {
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Connection error. Please try again.';
            });
        });

        // Navigation will be handled by layout.js

    </script>
    </body>
</html>
