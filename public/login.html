<!DOCTYPE html>
<!-- TODO: add an admin user in data folder -->
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>login screen</title>
    </head>
    <body>
        <form id='login' action="/login" method="POST" autocomplete="on">
            <input type="text" id="username" name="username" required>
            <label for="username">Username: </label><br>

            <input type="password" id="password" name="password" required>
            <label for="password">Password: </label><br>
            <!-- TODO: make "remember me" checkbox visible ONLY if it isnt checked yet-->
            <!-- (only for when the user hasnt logged in yet in the last 12 days) -->
            <input type="checkbox" id="rememberMe" name="rememberMe" value="true">
            <label for="rememberMe">remember me</label><br><br>

            <input type="submit" value="submit">
        </form>

        <!-- display the error -->
        <div id="error" style="color: red; display: none;"></div>
    <!-- TODO: use javaScript to handle the submission -->
     <script>
            doument.querySelector('form').addEventListener('submit', function(event){
            // so i can use my own fetch() function to decide what happens on submission
            event.preventDefault();
        //    TODO: add final js form handling
            // get form data
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('rememberMe').checked;
            
            // send POST request to the server
            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'applications/json'},
                body: JSON.stringify({username, password, remember})
            })

            // handle server response
            .then(response=> response.json())
            .then(data=> {
                if(data.success){
                    window.location.href= '/store.html';
                }
                else{
                    document.getElementById('error').textContent = data.message;
                }
            })

            // handle errors
            .catch(error=> {
                console.error('Error: ', error);
            });
        });
    </script>
    </body>
</html>
