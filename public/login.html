<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>Login - ShanikJewls</title>
        <!-- Font Awesome for icons <3 -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&display=swap">
        <link rel="stylesheet" href="/styles/theme.css">
        <style>
            /* Login-specific styles matching store theme */
            .login-container {
                min-height: calc(100vh - 200px);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 120px 20px 40px;
                background: linear-gradient(to bottom, rgba(251, 247, 240, 0.5), rgba(255, 255, 255, 0.8));
            }

            .login-form-card {
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(10px);
                width: 100%;
                max-width: 480px;
                padding: 56px 48px;
                border-radius: 24px;
                box-shadow: 0 20px 40px rgba(125, 111, 98, 0.15);
                border: 1px solid rgba(184, 134, 106, 0.1);
            }

            .login-title {
                font-family: 'Fraunces', serif;
                font-size: 36px;
                font-weight: 700;
                text-align: center;
                margin-bottom: 12px;
                color: #2f2721;
                letter-spacing: -0.5px;
            }

            .login-subtitle {
                text-align: center;
                color: #6b5d54;
                margin-bottom: 36px;
                font-size: 15px;
            }

            .login-subtitle a {
                color: #b8866a;
                text-decoration: none;
                font-weight: 600;
                transition: color 0.3s ease;
            }

            .login-subtitle a:hover {
                color: #7d514b;
                text-decoration: underline;
            }

            .login-form {
                display: flex;
                flex-direction: column;
                gap: 24px;
            }

            .form-group {
                display: flex;
                flex-direction: column;
                gap: 10px;
                margin-bottom: 20px;
            }

            .form-group label {
                font-size: 13px;
                font-weight: 600;
                color: #6b5d54;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            .form-group input {
                width: 100%;
                padding: 16px 18px;
                font-size: 15px;
                border: 1px solid rgba(184, 134, 106, 0.2);
                border-radius: 12px;
                transition: all 0.3s ease;
                background: rgba(255, 255, 255, 0.7);
                font-family: inherit;
            }

            .form-group input:focus {
                outline: none;
                border-color: #b8866a;
                background: white;
                box-shadow: 0 0 0 3px rgba(184, 134, 106, 0.1);
            }

            .form-group input::placeholder {
                color: #a39891;
                opacity: 0.8;
            }


            .checkbox-group {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-top: 12px;
                margin-bottom: 8px;
            }

            input[type="checkbox"] {
                width: 20px;
                height: 20px;
                cursor: pointer;
                accent-color: #b8866a;
            }

            .checkbox-group label {
                display: inline;
                font-size: 14px;
                cursor: pointer;
                user-select: none;
                color: #6b5d54;
                font-weight: 500;
            }

            .submit-btn {
                background: linear-gradient(135deg, #b8866a 0%, #7d514b 100%);
                color: white;
                border: none;
                padding: 16px 48px;
                border-radius: 30px;
                font-size: 15px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                margin-top: 28px;
                width: 100%;
                text-transform: uppercase;
                letter-spacing: 1px;
                box-shadow: 0 10px 20px rgba(125, 81, 75, 0.2);
            }

            .submit-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 12px 24px rgba(125, 81, 75, 0.3);
            }

            .submit-btn:active {
                transform: translateY(0);
            }

            .footer-text {
                text-align: center;
                margin-top: 32px;
                font-size: 14px;
                color: #8b7f77;
            }

            .footer-text a {
                color: #b8866a;
                text-decoration: none;
                font-weight: 600;
            }

            .footer-text a:hover {
                color: #7d514b;
                text-decoration: underline;
            }

            #error {
                background: rgba(220, 53, 69, 0.1);
                border: 1px solid rgba(220, 53, 69, 0.2);
                color: #dc3545;
                padding: 14px 16px;
                border-radius: 12px;
                font-size: 14px;
                margin-top: 20px;
                text-align: center;
                font-weight: 500;
            }

            .caps-lock-warning{
                color: #b8866a;
                padding: 8px 12px;
                border-radius: 8px;
                font-size: 13px;
                margin-top: 8px;
                display: none;
                background: rgba(184, 134, 106, 0.1);
                border: 1px solid rgba(184, 134, 106, 0.2);
            }

            /* dark mode styles */
            body.dark-mode{
                background: linear-gradient(to bottom, #1a1612, #0f0d0a);
                color: #e0e0e0;
            }

            body.dark-mode .login-container {
                background: linear-gradient(to bottom, rgba(26, 22, 18, 0.5), rgba(15, 13, 10, 0.8));
            }

            body.dark-mode .login-form-card {
                background: rgba(39, 36, 33, 0.95);
                border-color: rgba(140, 128, 116, 0.2);
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            }

            body.dark-mode .login-title {
                color: #f2ebe0;
            }

            body.dark-mode .login-subtitle {
                color: #c2b5a8;
            }

            body.dark-mode .form-group label {
                color: #c2b5a8;
            }

            body.dark-mode input[type="text"],
            body.dark-mode input[type="password"] {
                background: rgba(0, 0, 0, 0.3);
                border-color: rgba(140, 128, 116, 0.3);
                color: #e0e0e0;
            }

            body.dark-mode input[type="text"]:focus,
            body.dark-mode input[type="password"]:focus {
                border-color: #7a7a7a;
                background: rgba(0, 0, 0, 0.5);
                box-shadow: 0 0 0 3px rgba(122, 122, 122, 0.15);
            }

            body.dark-mode .checkbox-group label {
                color: #c2b5a8;
            }

            body.dark-mode .footer-text {
                color: #a39891;
            }

            body.dark-mode #error {
                background: rgba(220, 53, 69, 0.15);
                border-color: rgba(220, 53, 69, 0.3);
                color: #ff9999;
            }

            body.dark-mode .login-subtitle a,
            body.dark-mode .footer-text a {
                color: #8a8a8a;
            }

            body.dark-mode .login-subtitle a:hover,
            body.dark-mode .footer-text a:hover {
                color: #b0b0b0;
            }

            body.dark-mode .caps-lock-warning{
                color: #9a9a9a;
                background: rgba(154, 154, 154, 0.15);
                border-color: rgba(154, 154, 154, 0.3);
            }

            /* password visibility toggle */
            .password-container{
                position: relative;
                display: flex;
                align-items: center;
                width: 100%;
            }

            .password-container input {
                flex: 1;
                padding-right: 48px;
            }

            .password-toggle{
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                cursor: pointer;
                font-size: 18px;
                color: #a39891;
                user-select: none;
                padding: 8px;
                background: transparent;
                border: none;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: color 0.3s ease;
            }

            .password-toggle:hover{
                color: #b8866a;
            }

            body.dark-mode .password-toggle{
                color: #8b7f77;
            }

            body.dark-mode .password-toggle:hover{
                color: #9a9a9a;
            }

            /* dark mode button */
            body.dark-mode .submit-btn {
                background: linear-gradient(135deg, #6a6a6a 0%, #4a4a4a 100%);
                color: #f0f0f0;
                box-shadow: 0 10px 20px rgba(106, 106, 106, 0.2);
            }

            body.dark-mode .submit-btn:hover {
                box-shadow: 0 12px 24px rgba(106, 106, 106, 0.3);
            }
        </style>
    </head>
    <body>
        <!-- header with navigation -->
        <div class="header-shell">
            <div class="announcement-bar">
                <span class="announcement-pill"><i class="fa-solid fa-truck"></i> Free Shipping</span>
                <span>Complimentary express delivery on every order.</span>
                <button type="button" class="announcement-action" onclick="window.location.href='/store.html'">Shop Now <i class="fa-solid fa-arrow-right"></i></button>
            </div>
            <div class="header">
                <button class="menu" id="menu" onclick="toggleMenu()" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
                <div class="brand">
                    <h1>ShanikJewls</h1>
                    <span class="brand-tagline">Handcrafted Jewelry</span>
                </div>
                <div class="header-actions">
                    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle dark mode">
                        <span id="themeIcon">🌙</span>
                        <span id="themeText">OFF</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Side menu -->
        <div class="menu-overlay" id="menuOverlay"></div>
        <nav class="side-menu" id="sideMenu">
            <!-- Dynamic navigation will be populated by JavaScript -->
        </nav>

        <!-- Login Container -->
        <div class="login-container">
            <!-- Login Form Card -->
            <div class="login-form-card">
                <h1 class="login-title">Login</h1>
                <p class="login-subtitle">New to ShanikJewls? <a href="/register.html">Register here</a></p>

                <form class="login-form" action="/login" method="POST" autocomplete="on">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Your username" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-container">
                            <input type="password" id="password" name="password" placeholder="Your password" required>
                            <span class="password-toggle" onclick="togglePasswordVisibility('password', this)">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                                </svg>
                            </span>
                        </div>
                        <div id="capsLockWarning" class="caps-lock-warning">Notice: Caps Lock is ON</div>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="rememberMe" name="rememberMe" value="true">
                        <label for="rememberMe">Remember me</label>
                    </div>

                    <button type="submit" class="submit-btn">Login</button>
                </form>

                <!-- Error message -->
                <div id="error" style="display: none;"></div>
            </div>
        </div>
    <script src="/scripts/layout.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initializeBaseLayout();
        });

        // catch if caps Lock is on 
            const passwordInput = document.getElementById('password');
            const capsLockWarning = document.getElementById('capsLockWarning');

            function checkCapsLock(event) {
                if (event.getModifierState('CapsLock')) {
                    capsLockWarning.style.display = 'block';
                } else {
                    capsLockWarning.style.display = 'none';
                }
            }

            passwordInput.addEventListener('keyup', checkCapsLock);
            passwordInput.addEventListener('keydown', checkCapsLock);
            passwordInput.addEventListener('focus', checkCapsLock);

            // hide warning when password field loses focus
            passwordInput.addEventListener('blur', function() {
                capsLockWarning.style.display = 'none';
            });

            // on page load - check if username was saved
            window.onload = function() {
                const savedUsername = localStorage.getItem('rememberedUsername');
                if (savedUsername) {
                    document.getElementById('username').value = savedUsername;
                    document.getElementById('rememberMe').checked = true;
                }
            };

            // password visibility toggle
            function togglePasswordVisibility(inputId, toggleElement) {
                const passwordInput = document.getElementById(inputId);
                const svg = toggleElement.querySelector('svg');

                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    // switch to eye-slash (eye with diagonal line) icon
                    svg.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07" stroke="currentColor" stroke-width="2"/>';
                } else {
                    passwordInput.type = 'password';
                    // switch back to regular eye icon
                    svg.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
                }
            }

            document.querySelector('form').addEventListener('submit', function(event){
            // "prevent default" so i can use my own fetch() function to decide what happens on form submission
            event.preventDefault();
            // get form data
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // checking if the box is checked to tell the server what is the cookie duration (short/long)
            const remember = document.getElementById('rememberMe').checked;

            // save or remove username (based on 'remember me' checkbox)
            if (remember) {
                localStorage.setItem('rememberedUsername', username);
            } else {
                localStorage.removeItem('rememberedUsername');
            }

            // send POST request to the server
            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json'}, // tells server im sending JSON formated data (just a label)
                body: JSON.stringify({ username, password, remember }) // the data im sending (i saved it earlier in these elements)
            })

            /** fetch() returns a *promise*, not immidiate results (the network requests take time)
             *  ".then" is used to set what happens when the request finishes
             *
             *  1)fetch data=> 2)THEN convert to json=> 3)THEN handle the response
            */

            // handle server response
            .then(response=> response.json())
            .then(data=> {
                if(data.success){
                    // redirects user to store screen on form submission success
                    window.location.href= data.redirect || '/store.html';
                }
                else{
                    // presents an error message on form submission fail (missing field...)
                    document.getElementById('error').style.display = 'block';
                    document.getElementById('error').textContent = data.message;
                }
            })

            // handle errors
            .catch(error=> {
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Connection error. Please try again.';
            });
        });

        // Navigation will be handled by layout.js

    </script>
    </body>
</html>
