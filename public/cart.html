<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>Shopping Cart</title>
    <!-- Font Awesome for icons <3 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
        }

        .header {
            background: none;
            color: black;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .header h1 {
            margin: 0;
        }

        .menu {
            position: fixed;
            top: 35px;
            left: 20px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
            z-index: 1002;
        }

        .menu span {
            display: block;
            width: 25px;
            height: 3px;
            background: black;
            margin: 3px 0;
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100vh;
            background: green;
            transition: left 0.3s ease;
            z-index: 1000;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            overflow-y: auto;
            padding-top: 80px;
        }

        .side-menu.active {
            left: 0;
        }

        .side-menu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 20px 15px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: background 0.3s;
        }

        .side-menu a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .side-menu a i, .side-menu button i{
            margin-right: 10px;
            width: 16px;
            text-align: center;
        }

        .side-menu button {
            width: calc(100% - 40px);
            margin: 15px 20px;
            background: #d32f2f;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .side-menu button:hover {
            background: #b71c1c;
        }

        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 999;
        }

        .menu-overlay.active {
            display: block;
        }

        .cart-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .cart-items {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-image {
            width: 100px;
            height: 100px;
            background: #f0f0f0;
            border-radius: 4px;
            margin-right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .item-description {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .item-price {
            font-size: 18px;
            font-weight: bold;
            color: black;
        }

        .item-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-btn {
            width: 30px;
            height: 30px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 4px;
        }

        .quantity-btn:hover {
            background: #f0f0f0;
        }

        .quantity {
            width: 40px;
            text-align: center;
            font-size: 16px;
        }

        .remove-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        .remove-btn:hover {
            background: #d32f2f;
        }

        .cart-summary {
            background: white;
            border-radius: 8px;
            padding: 20px;
            position: sticky;
            top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .summary-total {
            font-size: 20px;
            font-weight: bold;
            border-top: 2px solid #eee;
            padding-top: 10px;
            margin-top: 10px;
        }

        .checkout-btn {
            width: 100%;
            background: green;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            margin-top: 20px;
        }

        .checkout-btn:hover {
            background: darkgreen;
        }

        .clear-cart-btn {
            width: 100%;
            background: #666;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        .continue-shopping-btn {
            width: 100%;
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        .continue-shopping-btn:hover {
            background: #45a049;
        }

        .customization-section {
            background: #f8f9fa;
            border-radius: 4px;
            padding: 10px;
            margin-top: 8px;
            border-left: 3px solid #FF9800;
        }

        .customization-label {
            font-weight: bold;
            color: #FF9800;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .customization-value {
            color: #333;
            font-style: italic;
            margin-bottom: 3px;
        }

        .customization-edit {
            margin-top: 8px;
        }

        .customization-input {
            width: 100%;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
            margin-bottom: 5px;
        }

        .customization-btn {
            background: #FF9800;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 5px;
        }

        .customization-btn:hover {
            background: #F57C00;
        }

        .edit-customization-btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            margin-top: 5px;
        }

        .empty-cart {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 8px;
        }

        .empty-cart h2 {
            color: #666;
        }

        .shop-btn {
            background: green;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .error {
            background: #f44336;
            color: white;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: center;
        }

        .success {
            background: #4CAF50;
            color: white;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        /* theme toggle button */
        .theme-toggle{
            position: fixed;
            top: 35px;
            right: 20px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 20px;
            width: 100px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            z-index: 1002;
            color: #333;
        }

        .theme-toggle:hover{
            background: #e0e0e0;
            transform: scale(1.05);
        }

        .theme-toggle #themeIcon{
            font-size: 16px;
        }

        /* dark mode styles */
        body.dark-mode{
            background-color: #1a1a1a;
            color: #e0e0e0;
        }

        body.dark-mode .cart-items,
        body.dark-mode .cart-summary,
        body.dark-mode .empty-cart{
            background: #2d2d2d;
            color: #e0e0e0;
        }

        body.dark-mode .cart-item{
            border-bottom-color: #444;
        }

        body.dark-mode .item-image{
            background: #1a1a1a;
        }

        body.dark-mode .theme-toggle{
            background: #2d2d2d;
            border-color: #555;
            color: #e0e0e0;
        }

        body.dark-mode .theme-toggle:hover{
            background: #3d3d3d;
        }

        body.dark-mode .side-menu{
            background: #2d2d2d;
        }

        body.dark-mode .menu span{
            background: white;
        }

        body.dark-mode .customization-section{
            background: #1a1a1a;
            border-left-color: #FF9800;
        }

        body.dark-mode .customization-value{
            color: #e0e0e0;
        }

        body.dark-mode .customization-input{
            background: #2d2d2d;
            border-color: #555;
            color: #e0e0e0;
        }

        body.dark-mode .side-menu a{
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .side-menu a:hover{
            background: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode label{
            color: #e0e0e0;
        }

        body.dark-mode p{
            color: #e0e0e0;
        }

        body.dark-mode h1, body.dark-mode h2, body.dark-mode h3{
            color: #e0e0e0;
        }

        body.dark-mode span, body.dark-mode div{
            color: #e0e0e0;
        }

        body.dark-mode .item-name{
            color: #e0e0e0;
        }

        body.dark-mode .item-description{
            color: #bbb;
        }

        body.dark-mode .item-price{
            color: #e0e0e0;
        }

        body.dark-mode .quantity{
            color: #e0e0e0;
        }

        body.dark-mode .summary-row{
            color: #e0e0e0;
        }

        body.dark-mode .summary-total{
            color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="menu" id="menu" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <h1>Shopping Cart</h1>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle dark mode">
            <span id="themeIcon">🌙</span>
            <span id="themeText">OFF</span>
        </button>
    </div>

    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <!-- Dynamic navigation will be populated by JavaScript -->
    </div>

    <div id="successMessage" class="success"></div>
    <div id="errorMessage" class="error" style="display: none;"></div>

    <div class="cart-container">
        <div id="loading" class="loading">Loading cart...</div>
        <div id="cartContent" style="display: none;"></div>
    </div>

    <script>
        let cartItems = [];
        let products = [];
        let isAuthenticated = false;

        document.addEventListener('DOMContentLoaded', function() {
            checkAuthStatus();
            loadCart();
            loadProducts();
            initializeTheme();
        });

        // Dark mode functionality
        function initializeTheme() {
            const savedTheme = localStorage.getItem('theme');
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                themeIcon.textContent = '🌙';
                themeText.textContent = 'ON';
            } else {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'OFF';
            }
        }

        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                themeIcon.textContent = '🌙';
                themeText.textContent = 'ON';
            } else {
                localStorage.setItem('theme', 'light');
                themeIcon.textContent = '🌙';
                themeText.textContent = 'OFF';
            }
        }

        function toggleMenu() {
            const menu = document.getElementById('menu');
            const sideMenu = document.getElementById('sideMenu');
            const overlay = document.getElementById('menuOverlay');

            menu.classList.toggle('active');
            sideMenu.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        async function checkAuthStatus(){
            try{
                const response = await fetch('/api/users/current');
                isAuthenticated = response.ok;
                updateNavigation();
            } catch(error){
                isAuthenticated = false;
                updateNavigation();
            }
        }

        function updateNavigation(){
            const sideMenu = document.getElementById('sideMenu');

            if(isAuthenticated){
                sideMenu.innerHTML = `
                    <a href="/store.html"><i class="fa-solid fa-store"></i> Store</a>
                    <a href="/cart.html"><i class="fa-solid fa-shopping-cart"></i> Cart</a>
                    <a href="/wishlist.html"><i class="fa-solid fa-heart"></i> Wishlist</a>
                    <a href="/about.html"><i class="fa-solid fa-info-circle"></i> About</a>
                    <a href="/contact.html"><i class="fa-solid fa-envelope"></i> Contact</a>
                    <a href="/readme.html"><i class="fa-solid fa-book"></i> README</a>
                    <a href="/profile.html"><i class="fa-solid fa-user"></i> Profile</a>
                    <a href="/admin.html"><i class="fa-solid fa-cog"></i> Admin</a>
                    <button onclick="logout()"><i class="fa-solid fa-sign-out-alt"></i> Logout</button>
                `;
            } else {
                sideMenu.innerHTML = `
                    <a href="/store.html"><i class="fa-solid fa-store"></i> Store</a>
                    <a href="/login.html"><i class="fa-solid fa-shopping-cart"></i> Cart</a>
                    <a href="/login.html"><i class="fa-solid fa-heart"></i> Wishlist</a>
                    <a href="/about.html"><i class="fa-solid fa-info-circle"></i> About</a>
                    <a href="/contact.html"><i class="fa-solid fa-envelope"></i> Contact</a>
                    <a href="/readme.html"><i class="fa-solid fa-book"></i> README</a>
                    <a href="/login.html"><i class="fa-solid fa-user"></i> Login</a>
                    <a href="/register.html"><i class="fa-solid fa-user-plus"></i> Register</a>
                `;
            }
        }

        async function loadProducts() {
            try {
                const response = await fetch('/api/products');
                products = await response.json();
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        async function loadCart() {
            try {
                const response = await fetch('/api/cart');
                if (!response.ok) {
                    throw new Error('Failed to load cart');
                }

                cartItems = await response.json();
                displayCart();
            } catch (error) {
                console.error('Error loading cart:', error);
                showError('Failed to load cart');
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('cartContent').style.display = 'block';
            }
        }

        function displayCart() {
            const container = document.getElementById('cartContent');

            if (!cartItems || cartItems.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <h2>Your cart is empty</h2>
                        <p>Add some beautiful gold jewelry to your cart!</p>
                        <button class="shop-btn" onclick="window.location.href='/store.html'">Continue Shopping</button>
                    </div>
                `;
                return;
            }

            const total = cartItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const itemCount = cartItems.reduce((sum, item) => sum + item.quantity, 0);

            container.innerHTML = `
                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
                    <div class="cart-items">
                        <h2>Cart Items (${itemCount})</h2>
                        ${cartItems.map(item => {
                            // Products that need better positioning (no cropping of jewelry)
                            const customPositions = {
                                1: 'object-position: center 80%;', // Delicate Gold Chain Necklace - moved a bit lower
                                2: 'object-position: center 80%;', // Minimalist Gold Hoop Earrings - moved a lot lower
                                5: 'object-position: center 15%;', // Layered Chain Necklace Set - show necklaces
                                9: 'object-position: center 70%;', // Minimalist Gold Ring Set - moved a bit lower
                                12: 'object-position: center 60%;', // Gold Chain Bracelet - moved a bit lower
                                13: 'object-position: center 30%;', // Twisted Gold Ring - moved a bit higher
                                15: 'object-position: center 40%;' // Gold Vintage Ring - moved a bit higher
                            };

                            const imageStyle = customPositions[item.productId] ?
                                `style="width: 100%; height: 100%; object-fit: cover; ${customPositions[item.productId]}"` :
                                'style="width: 100%; height: 100%; object-fit: cover; object-position: center;"';

                            return `
                            <div class="cart-item">
                                <div class="item-image">
                                    ${item.image ? `<img src="${item.image}" alt="${item.name}" ${imageStyle}>` : 'No image'}
                                </div>
                                <div class="item-details">
                                    <div class="item-name">${item.name}</div>
                                    <div class="item-description">${item.description || ''}</div>
                                    <div class="item-price">₪${item.price.toFixed(2)}</div>
                                    ${isCustomizable(item.productId) ? (item.customization ? `
                                        <div class="customization-section">
                                            <div class="customization-label">🎨 Customization:</div>
                                            <div id="customization-display-${item.productId}">
                                                ${Object.entries(item.customization).map(([key, value]) => `
                                                    <div class="customization-value"><strong>${key}:</strong> ${value}</div>
                                                `).join('')}
                                            </div>
                                            <button class="edit-customization-btn" onclick="toggleCustomizationEdit(${item.productId})">✏️ Edit</button>
                                            <div id="customization-edit-${item.productId}" class="customization-edit" style="display: none;">
                                                ${Object.entries(item.customization).map(([key, value]) => `
                                                    <input type="text" class="customization-input" id="${key}-${item.productId}" placeholder="${key}" value="${value}">
                                                `).join('')}
                                                <button class="customization-btn" onclick="saveCustomization(${item.productId})">💾 Save</button>
                                                <button class="customization-btn" onclick="cancelCustomizationEdit(${item.productId})">❌ Cancel</button>
                                            </div>
                                        </div>
                                    ` : `
                                        <div class="customization-section">
                                            <div class="customization-label">🎨 Add Customization:</div>
                                            <button class="edit-customization-btn" onclick="showAddCustomization(${item.productId})">➕ Add Custom Text</button>
                                            <div id="customization-add-${item.productId}" class="customization-edit" style="display: none;">
                                                <input type="text" class="customization-input" id="engraving-${item.productId}" placeholder="Engraving text (e.g., initials, name)">
                                                <button class="customization-btn" onclick="addCustomization(${item.productId})">💾 Add</button>
                                                <button class="customization-btn" onclick="cancelAddCustomization(${item.productId})">❌ Cancel</button>
                                            </div>
                                        </div>
                                    `) : ''}
                                </div>
                                <div class="item-controls">
                                    <div class="quantity-controls">
                                        <button class="quantity-btn" onclick="updateQuantity(${item.cartItemId || item.productId}, ${item.quantity - 1}, ${item.productId})">-</button>
                                        <span class="quantity">${item.quantity}</span>
                                        <button class="quantity-btn" onclick="updateQuantity(${item.cartItemId || item.productId}, ${item.quantity + 1}, ${item.productId})">+</button>
                                    </div>
                                    <button class="remove-btn" onclick="removeFromCart(${item.cartItemId || item.productId})">Remove</button>
                                </div>
                            </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="cart-summary">
                        <h2>Order Summary</h2>
                        <div class="summary-row">
                            <span>Items (${itemCount}):</span>
                            <span>₪${total.toFixed(2)}</span>
                        </div>
                        <div class="summary-row summary-total">
                            <span>Total:</span>
                            <span>₪${total.toFixed(2)}</span>
                        </div>
                        <button class="checkout-btn" onclick="window.location.href='/checkout.html'">Proceed to Checkout</button>
                        <button class="clear-cart-btn" onclick="clearCart()">Clear Cart</button>
                        <button class="continue-shopping-btn" onclick="window.location.href='/store.html'">Continue Shopping</button>
                    </div>
                </div>
            `;
        }

        async function updateQuantity(cartItemId, newQuantity, productId) {
            if (newQuantity < 1) {
                removeFromCart(cartItemId);
                return;
            }

            try {
                const response = await fetch('/api/cart/update', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ productId, quantity: newQuantity })
                });

                const data = await response.json();
                if (data.success) {
                    await loadCart();
                    showSuccess('Cart updated');
                } else {
                    showError('Failed to update cart');
                }
            } catch (error) {
                console.error('Error updating cart:', error);
                showError('Failed to update cart');
            }
        }

        async function removeFromCart(cartItemId) {
            try {
                const response = await fetch(`/api/cart/remove/${cartItemId}`, {
                    method: 'DELETE'
                });

                const data = await response.json();
                if (data.success) {
                    await loadCart();
                    showSuccess('Item removed from cart');
                } else {
                    showError('Failed to remove item');
                }
            } catch (error) {
                console.error('Error removing item:', error);
                showError('Failed to remove item');
            }
        }

        async function clearCart() {
            if (!confirm('Are you sure you want to clear your cart?')) {
                return;
            }

            try {
                const response = await fetch('/api/cart/clear', {
                    method: 'DELETE'
                });

                const data = await response.json();
                if (data.success) {
                    await loadCart();
                    showSuccess('Cart cleared');
                } else {
                    showError('Failed to clear cart');
                }
            } catch (error) {
                console.error('Error clearing cart:', error);
                showError('Failed to clear cart');
            }
        }

        async function logout() {
            try {
                const response = await fetch('/logout', {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    window.location.reload();
                }
            } catch (error) {
                console.error('Logout error:', error);
            }
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // Helper function to check if a product is customizable
        function isCustomizable(productId) {
            const product = products.find(p => p.id === productId);
            return product ? product.customizable : false;
        }

        // Customization functions
        function toggleCustomizationEdit(productId) {
            const displayDiv = document.getElementById(`customization-display-${productId}`);
            const editDiv = document.getElementById(`customization-edit-${productId}`);

            if (editDiv.style.display === 'none') {
                editDiv.style.display = 'block';
                displayDiv.style.display = 'none';
            } else {
                editDiv.style.display = 'none';
                displayDiv.style.display = 'block';
            }
        }

        function cancelCustomizationEdit(productId) {
            const displayDiv = document.getElementById(`customization-display-${productId}`);
            const editDiv = document.getElementById(`customization-edit-${productId}`);
            editDiv.style.display = 'none';
            displayDiv.style.display = 'block';
        }

        function showAddCustomization(productId) {
            const addDiv = document.getElementById(`customization-add-${productId}`);
            addDiv.style.display = 'block';
        }

        function cancelAddCustomization(productId) {
            const addDiv = document.getElementById(`customization-add-${productId}`);
            addDiv.style.display = 'none';
            document.getElementById(`engraving-${productId}`).value = '';
        }

        async function saveCustomization(productId) {
            try {
                const item = cartItems.find(item => item.productId === productId);
                if (!item) return;

                const newCustomization = {};
                Object.keys(item.customization).forEach(key => {
                    const input = document.getElementById(`${key}-${productId}`);
                    if (input && input.value.trim()) {
                        newCustomization[key] = input.value.trim();
                    }
                });

                const response = await fetch('/api/cart/update-customization', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        productId: productId,
                        customization: newCustomization
                    })
                });

                const data = await response.json();
                if (data.success) {
                    showSuccess('Customization updated!');
                    loadCart(); // Reload cart to show updated data
                } else {
                    showError('Failed to update customization');
                }
            } catch (error) {
                console.error('Error updating customization:', error);
                showError('Connection error. Please try again.');
            }
        }

        async function addCustomization(productId) {
            try {
                const engravingInput = document.getElementById(`engraving-${productId}`);
                const engravingText = engravingInput.value.trim();

                if (!engravingText) {
                    showError('Please enter text for engraving');
                    return;
                }

                const response = await fetch('/api/cart/update-customization', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        productId: productId,
                        customization: {
                            engraving: engravingText
                        }
                    })
                });

                const data = await response.json();
                if (data.success) {
                    showSuccess('Customization added!');
                    loadCart(); // Reload cart to show updated data
                } else {
                    showError('Failed to add customization');
                }
            } catch (error) {
                console.error('Error adding customization:', error);
                showError('Connection error. Please try again.');
            }
        }
    </script>
</body>
</html>
