<!DOCTYPE html>
<html>
    <head>
        <!-- TODO: customize the styling-->
        <meta charset="UTF-8"/>
        <title>Register Screen</title>
        <style>
            body{
                font-family: Arial, sans-serif;
                max-width: 400px;
                margin: 50px auto;
                padding: 20px;
            }

            form{
                /* light lavendar */
                background: #E3E4FA ; 
                padding: 20px;
                border-radius: 8px;
            }

            input[type="text"], input[type="password"], input[type="email"]{
                width: 100%;
                padding: 8px;
                margin: 5px 0;
                box-sizing: border-box;
            }

            input[type="text"]:focus, input[type="password"]:focus, input[type="email"]:focus{
                /* light pink */
                background-color: #FFD1DC ;
                border: 3px solid #555;
            }


            label[for="rememberMe"]{
                font-size: 14px;
            }

            input[type="submit"]{
                background: #4CAF50;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                display: block;
                margin: 0 auto;
            }
            
            p{
                font-size: small;
            }
        </style>
    </head>
    <body>
        <form action="/register" method="POST" autocomplete="on">
            <label for="username">Username: </label>
            <input type="text" id="username" name="username" placeholder="Your username" required><br><br>

            <label for="password">Password: </label>
            <input type="password" id="password" name="password" placeholder="Your password" required><br><br>

            <label for="confirm">Confirm password: </label>
            <input type="password" id="confirm" name="confirm" placeholder="Confirm password" required><br><br>

            <lable for="email">Email: </lable>
            <input type="email" id="email" name="email" placeholder="Your email" required><br><br>

            <input type="checkbox" id="rememberMe" name="rememberMe" value="true">
            <label for="rememberMe">remember me</label><br><br><br>

            <input type="submit" value="submit">
        </form><br>

        <p>Already have an account for ShaniknJewls? <a href="/login.html">Sign in here</a></p>
        <!-- display the error (after the form, right before the script)-->
        <div id="error" style="color: red; display: none;"></div>
    <script>
            document.querySelector('form').addEventListener('submit', function(event){
            event.preventDefault();

            // get form data
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm').value;
            const email = document.getElementById('email').value;

            const remember = document.getElementById('rememberMe').checked;

            // password validation check
            if(password !== confirmPassword){
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Passwords must match';
                // stop (before sending to the server)
                return;
            }

            // email validation check
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if(!emailRegex.test(email)){
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').testContent = 'Enter a valid email address';
                // stop (before sending to the server)
                return;
            }

            // send POST request to the server
            fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json'}, 
                body: JSON.stringify({ username, password, email, remember }) 
            })

            // handle server response
            .then(response=> response.json())
            .then(data=> {
                if(data.success){
                    // redirects user to store screen on form submission success
                    window.location.href= data.redirect || '/store.html';
                }
                else{
                    document.getElementById('error').style.display = 'block';
                    document.getElementById('error').textContent = data.message;
                }
            })

            // handle errors
            .catch(error=> {
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Connection error. Please try again.';
            });
        });
    </script>
    </body>
</html>
