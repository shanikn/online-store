<!DOCTYPE html>
<html>
    <head>
        <!-- TODO: customize the styling-->
        <meta charset="UTF-8"/>
        <title>Register - ShanikJewls</title>
        <!-- Font Awesome for icons <3 -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&display=swap">
        <link rel="stylesheet" href="/styles/theme.css">
        <style>
            /* Register-specific styles */
            .register-container {
                min-height: calc(100vh - 200px);
                display: flex;
                align-items: flex-start;
                justify-content: center;
                padding: 60px 20px 40px;
            }

            .register-form-card {
                background: transparent;
                width: 100%;
                max-width: 440px;
                padding: 48px 40px;
            }

            .register-title {
                font-size: 32px;
                font-weight: 700;
                text-align: center;
                margin-bottom: 16px;
                color: var(--text-primary);
            }

            .register-subtitle {
                text-align: center;
                color: var(--text-secondary);
                margin-bottom: 32px;
                font-size: 14px;
            }

            .register-subtitle a {
                color: var(--accent-gold);
                text-decoration: none;
                font-weight: 500;
            }

            .register-subtitle a:hover {
                text-decoration: underline;
            }

            .register-form {
                display: flex;
                flex-direction: column;
                gap: 24px;
            }

            .form-group {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .form-group input {
                width: 100%;
                padding: 14px 0;
                font-size: 15px;
                border: none;
                border-bottom: 2px solid rgba(162, 150, 138, 0.3);
                border-radius: 0;
                transition: all 0.2s ease;
                background: transparent;
                color: var(--text-primary);
            }

            .form-group input:focus {
                outline: none;
                border-bottom-color: var(--accent-gold);
            }

            .form-group input::placeholder {
                color: var(--text-secondary);
                opacity: 0.7;
            }

            .checkbox-group {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-top: 8px;
            }

            input[type="checkbox"] {
                width: 18px;
                height: 18px;
                cursor: pointer;
                accent-color: var(--accent-gold);
            }

            .checkbox-group label {
                display: inline;
                font-size: 14px;
                cursor: pointer;
                user-select: none;
                color: var(--text-primary);
            }

            .submit-btn {
                background: transparent;
                color: var(--accent-gold);
                border: 1px solid var(--accent-gold);
                padding: 12px 32px;
                border-radius: 25px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                margin-top: 24px;
                width: auto;
                min-width: 120px;
                align-self: center;
            }

            .submit-btn:hover {
                background: var(--accent-gold);
                color: var(--surface);
                transform: translateY(-1px);
            }

            #error {
                background: rgba(220, 53, 69, 0.1);
                border: 1px solid rgba(220, 53, 69, 0.3);
                color: #dc3545;
                padding: 12px;
                border-radius: 8px;
                font-size: 14px;
                margin-top: 16px;
                text-align: center;
            }

            /* Password visibility toggle */
            .password-container {
                position: relative;
                display: flex;
                align-items: center;
                width: 100%;
            }

            .password-container input {
                flex: 1;
                padding-right: 40px;
            }

            .password-toggle {
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                cursor: pointer;
                color: var(--text-secondary);
                user-select: none;
                padding: 5px;
                background: transparent;
                border: none;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .password-toggle:hover {
                color: var(--accent-gold);
            }
        </style>
    </head>
    <body>
        <!-- header with navigation -->
        <div class="header-shell">
            <div class="announcement-bar">
                <span class="announcement-pill"><i class="fa-solid fa-truck"></i> Free Shipping</span>
                <span>Complimentary express delivery on every order.</span>
                <button type="button" class="announcement-action" onclick="window.location.href='/store.html'">Shop Now <i class="fa-solid fa-arrow-right"></i></button>
            </div>
            <div class="header">
                <button class="menu" id="menu" onclick="toggleMenu()" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
                <div class="brand">
                    <h1>ShanikJewls</h1>
                    <span class="brand-tagline">Handcrafted Jewelry</span>
                </div>
                <div class="header-actions">
                    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle dark mode">
                        <span id="themeIcon">🌙</span>
                        <span id="themeText">OFF</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Side menu -->
        <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
        <nav class="side-menu" id="sideMenu">
            <!-- Dynamic navigation will be populated by JavaScript -->
        </nav>

        <!-- Register Container -->
        <div class="register-container">

            <div class="register-form-card">
                <h1 class="register-title">Register</h1>
                <p class="register-subtitle">Already have an account? <a href="/login.html">Log In</a></p>

                <form action="/register" method="POST" autocomplete="on" class="register-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Email" required>
                    </div>

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Username" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-container">
                            <input type="password" id="password" name="password" placeholder="Choose a password" required>
                            <span class="password-toggle" onclick="togglePasswordVisibility('password', this)">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                                </svg>
                            </span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirm">Confirm Password</label>
                        <div class="password-container">
                            <input type="password" id="confirm" name="confirm" placeholder="Confirm password" required>
                            <span class="password-toggle" onclick="togglePasswordVisibility('confirm', this)">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                                </svg>
                            </span>
                        </div>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="rememberMe" name="rememberMe" value="true">
                        <label for="rememberMe">Remember me</label>
                    </div>

                    <button type="submit" class="submit-btn">Register</button>
                </form>

                <!-- Error message -->
                <div id="error" style="display: none;"></div>
            </div>
        </div>

        <script src="/scripts/layout.js"></script>
        <script>
            // Initialize layout and theme on page load
            document.addEventListener('DOMContentLoaded', function() {
                initializeBaseLayout();
            });

            // password visibility toggle
            function togglePasswordVisibility(inputId, toggleElement) {
                const passwordInput = document.getElementById(inputId);
                const svg = toggleElement.querySelector('svg');

                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    // switch to eye-slash (eye with diagonal line) icon
                    svg.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07" stroke="currentColor" stroke-width="2"/>';
                } else {
                    passwordInput.type = 'password';
                    // switch back to regular eye icon
                    svg.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
                }
            }
            document.querySelector('form').addEventListener('submit', function(event){
            event.preventDefault();

            // clear any previous error messages
            document.getElementById('error').style.display = 'none';
            document.getElementById('error').textContent = '';

            // get form data
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm').value;
            const email = document.getElementById('email').value;

            const remember = document.getElementById('rememberMe').checked;

            // password validation check
            if(password !== confirmPassword){
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Passwords must match';
                // stop (before sending to the server)
                return;
            }

            // email validation check (email must include @...)
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if(!emailRegex.test(email)){
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Enter a valid email address';
                // stop (before sending to the server)
                return;
            }

            // send POST request to the server
            fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json'}, 
                body: JSON.stringify({ username, password, email, remember }) 
            })

            // handle server response
            .then(response=> response.json())
            .then(data=> {
                if(data.success){
                    // redirects user to store screen on form submission success
                    window.location.href= data.redirect || '/store.html';
                }
                else{
                    document.getElementById('error').style.display = 'block';
                    document.getElementById('error').textContent = data.message;
                }
            })

            // handle errors
            .catch(error=> {
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Connection error. Please try again.';
            });
        });

    </script>
    </body>
</html>
