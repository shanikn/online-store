<!-- enforce user login to access *any* other pages (other than: readme, products, login, register) -->
<!-- add my user (username: admin, password: admins) -->

<!DOCTYPE html>
<html>
    <head>
        <!-- TODO: customize the styling-->
        <meta charset="UTF-8"/>
        <title>Register</title>
        <style>
            body{
                font-family: Arial, sans-serif;
                max-width: 400px;
                margin: 50px auto;
                padding: 20px;
            }

            form{
                /* light lavendar */
                background: #E3E4FA ; 
                padding: 20px;
                border-radius: 8px;
            }

            input[type="text"], input[type="password"], input[type="email"]{
                width: 100%;
                padding: 8px;
                margin: 5px 0;
                box-sizing: border-box;
            }

            input[type="text"]:focus, input[type="password"]:focus, input[type="email"]:focus{
                /* light pink */
                background-color: #FFD1DC ;
                border: 3px solid #555;
            }


            label[for="rememberMe"]{
                font-size: 14px;
            }

            input[type="submit"]{
                background: #4CAF50;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                display: block;
                margin: 0 auto;
            }
            
            p{
                font-size: small;
            }

            /* theme toggle button */
            .theme-toggle{
                position: fixed;
                top: 20px;
                right: 20px;
                background: #f0f0f0;
                border: 2px solid #ddd;
                border-radius: 25px;
                width: 80px;
                height: 35px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 14px;
                font-weight: bold;
                transition: all 0.3s ease;
                z-index: 1002;
                color: #333;
            }

            .theme-toggle:hover{
                background: #e0e0e0;
                transform: scale(1.05);
            }

            .theme-toggle #themeIcon{
                font-size: 16px;
            }

            /* dark mode styles */
            body.dark-mode{
                background-color: #1a1a1a;
                color: #e0e0e0;
            }

            body.dark-mode form{
                background: #2d2d2d;
                color: #e0e0e0;
            }

            body.dark-mode input[type="text"],
            body.dark-mode input[type="password"],
            body.dark-mode input[type="email"]{
                background: #1a1a1a;
                border-color: #555;
                color: #e0e0e0;
            }

            body.dark-mode input[type="text"]:focus,
            body.dark-mode input[type="password"]:focus,
            body.dark-mode input[type="email"]:focus{
                background-color: #2d2d2d;
                border-color: #777;
            }

            body.dark-mode .theme-toggle{
                background: #2d2d2d;
                border-color: #555;
                color: #e0e0e0;
            }

            body.dark-mode .theme-toggle:hover{
                background: #3d3d3d;
            }

            body.dark-mode a{
                color: #66b3ff;
            }

            body.dark-mode label{
                color: #e0e0e0;
            }

            body.dark-mode p{
                color: #e0e0e0;
            }

            body.dark-mode h1, body.dark-mode h2, body.dark-mode h3{
                color: #e0e0e0;
            }

            body.dark-mode span, body.dark-mode div{
                color: #e0e0e0;
            }

            body.dark-mode input[type="submit"]:hover{
                background: #45a049;
            }

            body.dark-mode .caps-lock-warning{
                color: #66b3ff;
            }

            /* password visibility toggle */
            .password-container{
                position: relative;
                display: inline-block;
                width: 100%;
            }

            .password-toggle{
                position: absolute;
                right: 10px;
                top: 50%;
                transform: translateY(-50%);
                cursor: pointer;
                font-size: 18px;
                color: #666;
                user-select: none;
            }

            .password-toggle:hover{
                color: #333;
            }

            body.dark-mode .password-toggle{
                color: #ccc;
            }

            body.dark-mode .password-toggle:hover{
                color: #fff;
            }
        </style>
    </head>
    <body>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle dark mode">
            <span id="themeIcon">🌙</span>
            <span id="themeText">OFF</span>
        </button>
        <form action="/register" method="POST" autocomplete="on">
            <label for="username">Username: </label>
            <input type="text" id="username" name="username" placeholder="Your username" required><br><br>

            <label for="password">Password: </label>
            <div class="password-container">
                <input type="password" id="password" name="password" placeholder="Your password" required>
                <span class="password-toggle" onclick="togglePasswordVisibility('password', this)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                </span>
            </div><br><br>

            <label for="confirm">Confirm password: </label>
            <div class="password-container">
                <input type="password" id="confirm" name="confirm" placeholder="Confirm password" required>
                <span class="password-toggle" onclick="togglePasswordVisibility('confirm', this)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                </span>
            </div><br><br>

            <lable for="email">Email: </lable>
            <input type="email" id="email" name="email" placeholder="Your email" required><br><br>

            <input type="checkbox" id="rememberMe" name="rememberMe" value="true">
            <label for="rememberMe">remember me</label><br><br><br>

            <input type="submit" value="submit">
        </form><br>

        <p>Already have an account for ShaniknJewls? <a href="/login.html">Sign in here</a></p>
        <!-- display the error (after the form, right before the script)-->
        <div id="error" style="color: red; display: none;"></div>
    <script>
            // Dark mode functionality
            function initializeTheme() {
                const savedTheme = localStorage.getItem('theme');
                const themeIcon = document.getElementById('themeIcon');
                const themeText = document.getElementById('themeText');
                if (savedTheme === 'dark') {
                    document.body.classList.add('dark-mode');
                    themeIcon.textContent = '🌙';
                    themeText.textContent = 'ON';
                } else {
                    themeIcon.textContent = '🌙';
                    themeText.textContent = 'OFF';
                }
            }

            function toggleTheme() {
                const body = document.body;
                const themeIcon = document.getElementById('themeIcon');
                const themeText = document.getElementById('themeText');
                body.classList.toggle('dark-mode');
                if (body.classList.contains('dark-mode')) {
                    localStorage.setItem('theme', 'dark');
                    themeIcon.textContent = '🌙';
                    themeText.textContent = 'ON';
                } else {
                    localStorage.setItem('theme', 'light');
                    themeIcon.textContent = '🌙';
                    themeText.textContent = 'OFF';
                }
            }

            // Initialize theme on page load
            window.onload = function() {
                initializeTheme();
            };

            // password visibility toggle
            function togglePasswordVisibility(inputId, toggleElement) {
                const passwordInput = document.getElementById(inputId);
                const svg = toggleElement.querySelector('svg');

                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    // switch to eye-slash (eye with diagonal line) icon
                    svg.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07" stroke="currentColor" stroke-width="2"/>';
                } else {
                    passwordInput.type = 'password';
                    // switch back to regular eye icon
                    svg.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
                }
            }
            document.querySelector('form').addEventListener('submit', function(event){
            event.preventDefault();

            // clear any previous error messages
            document.getElementById('error').style.display = 'none';
            document.getElementById('error').textContent = '';

            // get form data
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm').value;
            const email = document.getElementById('email').value;

            const remember = document.getElementById('rememberMe').checked;

            // password validation check
            if(password !== confirmPassword){
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Passwords must match';
                // stop (before sending to the server)
                return;
            }

            // email validation check (email must include @...)
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if(!emailRegex.test(email)){
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Enter a valid email address';
                // stop (before sending to the server)
                return;
            }

            // send POST request to the server
            fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json'}, 
                body: JSON.stringify({ username, password, email, remember }) 
            })

            // handle server response
            .then(response=> response.json())
            .then(data=> {
                if(data.success){
                    // redirects user to store screen on form submission success
                    window.location.href= data.redirect || '/store.html';
                }
                else{
                    document.getElementById('error').style.display = 'block';
                    document.getElementById('error').textContent = data.message;
                }
            })

            // handle errors
            .catch(error=> {
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Connection error. Please try again.';
            });
        });
    </script>
    </body>
</html>
