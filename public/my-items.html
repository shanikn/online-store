<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>My Items - ShanikJewels</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="/styles/theme.css">
</head>
<body>
    <!-- header with navigation -->
    <div class="header-shell">
        <div class="announcement-bar">
            <span class="announcement-pill"><i class="fa-solid fa-box"></i> My Items</span>
            <span>Your jewelry purchases and order history.</span>
            <button type="button" class="announcement-action" onclick="window.location.href='/store.html'">Shop More <i class="fa-solid fa-arrow-right"></i></button>
        </div>
        <div class="header">
            <button class="menu" id="menu" onclick="toggleMenu()" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
            <div class="brand">
                <h1>ShanikJewels</h1>
                <span class="brand-tagline">Handcrafted Jewelry</span>
            </div>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle dark mode">
                    <span id="themeIcon">🌙</span>
                    <span id="themeText">OFF</span>
                </button>
            </div>
        </div>
    </div>

    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <!-- Dynamic navigation will be populated by JavaScript -->
    </div>

    <main class="page-frame">
        <div id="successMessage" class="success"></div>
        <div id="errorMessage" class="error"></div>

        <section class="page-hero">
            <div class="page-hero__content">
                <h1 class="page-hero__title">My Items</h1>
                <p class="page-hero__copy">Your complete jewelry collection and purchase history.</p>
            </div>
        </section>

        <div class="profile-section">
            <h2>Order History</h2>
            <div id="purchaseHistory">
                <div class="loading">Loading your purchase history...</div>
            </div>
        </div>
    </main>

    <style>
        /* Reuse the same styles from profile.html for consistency */
        .page-frame {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 28px 80px;
        }

        .profile-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 18px 36px rgba(52, 41, 32, 0.1);
            border: 1px solid rgba(162, 150, 138, 0.2);
            margin-bottom: 40px;
        }

        .profile-section h2 {
            font-family: 'Fraunces', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: #5a4f42;
            margin: 0 0 25px;
            position: relative;
            padding-bottom: 12px;
        }

        .profile-section h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #766156, #5a4f42);
            border-radius: 2px;
        }

        .purchase-item {
            background: rgba(244, 240, 234, 0.6);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 20px;
            border-left: 4px solid #766156;
            box-shadow: 0 8px 20px rgba(118, 97, 86, 0.08);
        }

        .purchase-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .purchase-id {
            font-weight: bold;
            color: #333;
        }

        .purchase-date {
            color: #666;
            font-size: 14px;
        }

        .purchase-total {
            font-weight: bold;
            color: #766156;
            font-size: 18px;
        }

        .purchase-items {
            margin-top: 10px;
        }

        .item {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }

        .item:last-child {
            border-bottom: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
            display: none;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .no-purchases-message {
            text-align: center;
            padding: 30px 20px;
            color: #6b5744;
            font-size: 16px;
        }

        .no-purchases-message p {
            margin: 0 0 15px;
            font-weight: 500;
        }

        .start-shopping-link {
            display: inline-block;
            background: linear-gradient(135deg, #b8866a, #9d6c47);
            color: white !important;
            padding: 12px 24px;
            text-decoration: none !important;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(184, 134, 106, 0.2);
            border: 1px solid rgba(184, 134, 106, 0.3);
        }

        .start-shopping-link:hover {
            background: linear-gradient(135deg, #c4926f, #a67546);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(184, 134, 106, 0.3);
            text-decoration: none !important;
        }

        /* Dark Mode Styles */
        body.dark-mode .profile-section {
            background: rgba(32, 29, 27, 0.95);
            border-color: rgba(130, 116, 102, 0.35);
        }

        body.dark-mode .profile-section h2 {
            color: #e8ded2;
        }

        body.dark-mode .profile-section h2::after {
            background: linear-gradient(90deg, #938276, #82746a);
        }

        body.dark-mode .purchase-item {
            background: rgba(20, 18, 16, 0.8);
            border-left-color: #938276;
        }

        body.dark-mode .purchase-date {
            color: #c1b6a8;
        }

        body.dark-mode .purchase-id {
            color: #e8ded2;
        }

        body.dark-mode .purchase-total {
            color: #b8866a;
        }

        body.dark-mode .loading {
            color: #c1b6a8;
        }

        body.dark-mode .no-purchases-message {
            color: #c1b6a8;
        }

        body.dark-mode .start-shopping-link {
            background: linear-gradient(135deg, #766156, #5a4f42);
            border-color: rgba(118, 97, 86, 0.4);
            box-shadow: 0 2px 8px rgba(118, 97, 86, 0.2);
        }

        body.dark-mode .start-shopping-link:hover {
            background: linear-gradient(135deg, #877a70, #6b5d54);
            box-shadow: 0 4px 12px rgba(118, 97, 86, 0.3);
        }

        @media (max-width: 768px) {
            .purchase-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>

    <script src="/scripts/layout.js"></script>
    <script>
        // Reuse the exact same purchase logic from profile.html
        async function loadPurchaseHistory() {
            try {
                const response = await fetch('/api/purchases');
                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = '/login.html';
                        return;
                    }
                    throw new Error('Failed to load purchases');
                }

                const purchases = await response.json();
                // Sort purchases by date, latest first (using timestamp field)
                purchases.sort((a, b) => new Date(b.timestamp || b.orderDate) - new Date(a.timestamp || a.orderDate));
                displayPurchases(purchases);
            } catch (error) {
                console.error('Error loading purchases:', error);
                document.getElementById('purchaseHistory').innerHTML =
                    '<div class="error">Failed to load purchase history</div>';
            }
        }

        // Reuse the exact same display logic from profile.html
        function displayPurchases(purchases) {
            const container = document.getElementById('purchaseHistory');

            if (purchases.length === 0) {
                container.innerHTML = `
                    <div class="no-purchases-message">
                        <p>No purchases yet.</p>
                        <a href="/store.html" class="start-shopping-link">Start Shopping!</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = purchases.map(purchase => `
                <div class="purchase-item">
                    <div class="purchase-header">
                        <div class="purchase-id">Order #${purchase.id}</div>
                        <div class="purchase-date">${new Date(purchase.timestamp || purchase.orderDate).toLocaleDateString('he-IL', {
                            day: '2-digit',
                            month: '2-digit',
                            year: 'numeric'
                        })}</div>
                        <div class="purchase-total">₪${purchase.total.toFixed(2)}</div>
                    </div>
                    <div class="purchase-items">
                        ${purchase.items.map(item => `
                            <div class="item">
                                <span>${item.name} x${item.quantity}</span>
                                <span>₪${item.itemTotal.toFixed(2)}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            console.log('My Items DOM loaded - initializing...');
            
            // Initialize layout first
            try {
                initializeBaseLayout();
            } catch (error) {
                console.error('Error in initializeBaseLayout:', error);
            }

            // Load purchase data
            loadPurchaseHistory();
        });
    </script>
</body>
</html>
