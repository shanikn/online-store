<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>Admin Panel</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
        }

        .header {
            background: none;
            color: black;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .header h1 {
            margin: 0;
        }

        .menu {
            position: fixed;
            top: 35px;
            left: 20px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
            z-index: 1002;
        }

        .menu span {
            display: block;
            width: 25px;
            height: 3px;
            background: black;
            margin: 3px 0;
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100vh;
            background: green;
            transition: left 0.3s ease;
            z-index: 1000;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            overflow-y: auto;
            padding-top: 80px;
        }

        .side-menu.active {
            left: 0;
        }

        .side-menu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 20px 15px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            /* red background means important/dangerous actions like delete */
            transition: background 0.3s;
        }

        .side-menu a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .side-menu a i, .side-menu button i{
            margin-right: 10px;
            width: 16px;
            text-align: center;
        }

        .side-menu button {
            width: calc(100% - 40px);
            margin: 15px 20px;
            background: #d32f2f;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .side-menu button:hover {
            background: #b71c1c;
        }

        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            /* z-index controls layering order - higher values appear above lower values */
            z-index: 999;
        }

        .menu-overlay.active {
            display: block;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: white;
            padding: 10px;
            border-radius: 8px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: #f0f0f0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .tab-btn.active {
            background: green;
            color: white;
        }

        .tab-content {
            display: none;
            background: white;
            border-radius: 8px;
            padding: 20px;
        }

        .tab-content.active {
            display: block;
        }

        /* activity Log Styles */
        .filter-section {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-section input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 200px;
        }

        .filter-section button {
            padding: 8px 16px;
            background: green;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .activity-table {
            width: 100%;
            border-collapse: collapse;
        }

        .activity-table th {
            background: #f0f0f0;
            padding: 12px;
            text-align: left;
            border-bottom: 2px solid #ddd;
        }

        .activity-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
        }

        .activity-table tr:hover {
            background: #f9f9f9;
        }

        .activity-type {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .activity-type.login {
            background: #4CAF50;
            color: white;
        }

        .activity-type.logout {
            background: #FF9800;
            color: white;
        }

        .activity-type.add-to-cart {
            background: #2196F3;
            color: white;
        }

        .activity-type.purchase {
            background: #9C27B0;
            color: white;
        }

        /* Product management section for adding/removing products from catalog */
        /* product Management Styles */
        .product-form {
            max-width: 600px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .add-product-btn {
            background: green;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .add-product-btn:hover {
            background: darkgreen;
        }

        .products-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            position: relative;
        }

        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: contain;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .product-card h3 {
            margin: 10px 0;
        }

        .product-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 18px;
            font-weight: bold;
            color: green;
        }

        .delete-product-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #f44336;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card h3 {
            margin: 0;
            font-size: 32px;
        }

        .stat-card p {
            margin: 5px 0 0 0;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .error {
            background: #f44336;
            color: white;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: center;
        }

        .success {
            background: #4CAF50;
            color: white;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        /* theme toggle button */
        .theme-toggle{
            position: fixed;
            top: 35px;
            right: 20px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 20px;
            width: 100px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            z-index: 1002;
            color: #333;
        }

        .theme-toggle:hover{
            background: #e0e0e0;
            transform: scale(1.05);
        }

        .theme-toggle #themeIcon{
            font-size: 16px;
        }

        /* dark mode styles */
        body.dark-mode{
            background-color: #1a1a1a;
            color: #e0e0e0;
        }

        body.dark-mode .admin-container,
        body.dark-mode .section,
        body.dark-mode .activity-table,
        body.dark-mode .product-form{
            background: #2d2d2d;
            color: #e0e0e0;
        }

        body.dark-mode .activity-table th,
        body.dark-mode .activity-table td{
            border-color: #444;
        }

        body.dark-mode .form-group input,
        body.dark-mode .form-group textarea,
        body.dark-mode .filter-input{
            background: #1a1a1a;
            border-color: #555;
            color: #e0e0e0;
        }

        body.dark-mode .theme-toggle{
            background: #2d2d2d;
            border-color: #555;
            color: #e0e0e0;
        }

        body.dark-mode .theme-toggle:hover{
            background: #3d3d3d;
        }

        body.dark-mode .side-menu{
            background: #2d2d2d;
        }

        body.dark-mode .menu span{
            background: white;
        }

        body.dark-mode .side-menu a{
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .side-menu a:hover{
            background: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode label{
            color: #e0e0e0;
        }

        body.dark-mode p{
            color: #e0e0e0;
        }

        body.dark-mode h1, body.dark-mode h2, body.dark-mode h3{
            color: #e0e0e0;
        }

        body.dark-mode span, body.dark-mode div{
            color: #e0e0e0;
        }

        body.dark-mode .admin-tabs{
            background: #2d2d2d;
        }

        body.dark-mode .tab-content{
            background: #2d2d2d;
            color: #e0e0e0;
        }

        body.dark-mode .tab-btn{
            background: #1a1a1a;
            color: #e0e0e0;
            border-color: #555;
        }

        body.dark-mode .tab-btn.active{
            background: green;
            color: white;
        }

        body.dark-mode .product-card{
            background: #1a1a1a;
            color: #e0e0e0;
        }

        body.dark-mode .product-card h3{
            color: #e0e0e0;
        }

        body.dark-mode .product-card p{
            color: #ccc;
        }

        body.dark-mode .stat-card h3,
        body.dark-mode .stat-card p{
            color: white;
        }

        body.dark-mode .activity-table th{
            background: #1a1a1a;
            color: #e0e0e0;
        }

        body.dark-mode .activity-table td{
            color: #e0e0e0;
        }

        body.dark-mode .activity-table tr:hover{
            background: #3d3d3d;
        }

        body.dark-mode .no-data,
        body.dark-mode .loading{
            color: #ccc;
        }

        body.dark-mode .filter-section button:hover,
        body.dark-mode .add-product-btn:hover{
            background: darkgreen;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="menu" id="menu" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <h1>Admin Dashboard</h1>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle dark mode">
            <span id="themeIcon">🌙</span>
            <span id="themeText">OFF</span>
        </button>
    </div>

    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <!-- Dynamic navigation will be populated by JavaScript -->
    </div>

    <div id="successMessage" class="success"></div>
    <div id="errorMessage" class="error" style="display: none;"></div>

    <div class="admin-container">
        <div class="admin-tabs">
            <button class="tab-btn active" onclick="switchTab('dashboard')">Dashboard</button>
            <button class="tab-btn" onclick="switchTab('activities')">Activity Logs</button>
            <button class="tab-btn" onclick="switchTab('products')">Product Management</button>
        </div>

        <!-- Dashboard Tab -->
        <div id="dashboard-tab" class="tab-content active">
            <h2>Dashboard Overview</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3 id="totalUsers">0</h3>
                    <p>Total Users</p>
                </div>
                <div class="stat-card">
                    <h3 id="totalProducts">0</h3>
                    <p>Total Products</p>
                </div>
                <div class="stat-card">
                    <h3 id="todayActivities">0</h3>
                    <p>Today's Activities</p>
                </div>
                <div class="stat-card">
                    <h3 id="totalSales">₪0</h3>
                    <p>Total Sales</p>
                </div>
            </div>
            <h3>Recent Activities</h3>
            <div id="recentActivities"></div>
        </div>

        <!-- Activities Tab -->
        <div id="activities-tab" class="tab-content">
            <h2>User Activity Logs</h2>
            <div class="filter-section">
                <input type="text" id="usernameFilter" placeholder="Filter by username prefix...">
                <button onclick="filterActivities()">Filter</button>
                <button onclick="clearFilter()">Clear</button>
            </div>
            <div id="activitiesContent">
                <div class="loading">Loading activities...</div>
            </div>
        </div>

        <!-- Products Tab -->
        <div id="products-tab" class="tab-content">
            <h2>Product Management</h2>

            <div class="product-form">
                <h3>Add New Product</h3>
                <form id="addProductForm">
                    <div class="form-group">
                        <label for="productName">Product Name *</label>
                        <input type="text" id="productName" required>
                    </div>
                    <div class="form-group">
                        <label for="productDescription">Description *</label>
                        <textarea id="productDescription" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="productPrice">Price (₪) *</label>
                        <input type="number" id="productPrice" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="productImage">Image URL</label>
                        <input type="url" id="productImage" placeholder="https://example.com/image.jpg">
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="productCustomizable">
                            Customizable Product
                        </label>
                    </div>
                    <button type="submit" class="add-product-btn">Add Product</button>
                </form>
            </div>

            <h3>Current Products</h3>
            <div id="productsContent">
                <div class="loading">Loading products...</div>
            </div>
        </div>
    </div>

    <script>
        let activities = [];
        let products = [];
        let users = [];
        let currentUser = null;
        let isAuthenticated = false;

        document.addEventListener('DOMContentLoaded', function() {
            checkAuthStatus();
            checkAdminAccess();
            loadDashboard();
            loadActivities();
            loadProducts();
            initializeTheme();
        });

        // Dark mode functionality
        function initializeTheme() {
            const savedTheme = localStorage.getItem('theme');
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                themeIcon.textContent = '🌙';
                themeText.textContent = 'ON';
            } else {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'OFF';
            }
        }

        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                themeIcon.textContent = '🌙';
                themeText.textContent = 'ON';
            } else {
                localStorage.setItem('theme', 'light');
                themeIcon.textContent = '🌙';
                themeText.textContent = 'OFF';
            }
        }

        async function checkAdminAccess() {
            // Check if user is admin (you can enhance this with actual server check)
            try {
                const response = await fetch('/api/products');
                if (!response.ok && response.status === 401) {
                    window.location.href = '/login.html';
                }
            } catch (error) {
                console.error('Access check failed:', error);
            }
        }

        function toggleMenu() {
            const menu = document.getElementById('menu');
            const sideMenu = document.getElementById('sideMenu');
            const overlay = document.getElementById('menuOverlay');

            menu.classList.toggle('active');
            sideMenu.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        async function checkAuthStatus(){
            try{
                const response = await fetch('/api/users/current');
                isAuthenticated = response.ok;
                updateNavigation();
            } catch(error){
                isAuthenticated = false;
                updateNavigation();
            }
        }

        function updateNavigation(){
            const sideMenu = document.getElementById('sideMenu');

            if(isAuthenticated){
                sideMenu.innerHTML = `
                    <a href="/store.html"><i class="fa-solid fa-store"></i> Store</a>
                    <a href="/cart.html"><i class="fa-solid fa-shopping-cart"></i> Cart</a>
                    <a href="/wishlist.html"><i class="fa-solid fa-heart"></i> Wishlist</a>
                    <a href="/about.html"><i class="fa-solid fa-info-circle"></i> About</a>
                    <a href="/contact.html"><i class="fa-solid fa-envelope"></i> Contact</a>
                    <a href="/readme.html"><i class="fa-solid fa-book"></i> README</a>
                    <a href="/profile.html"><i class="fa-solid fa-user"></i> Profile</a>
                    <a href="/admin.html"><i class="fa-solid fa-cog"></i> Admin</a>
                    <button onclick="logout()"><i class="fa-solid fa-sign-out-alt"></i> Logout</button>
                `;
            } else {
                sideMenu.innerHTML = `
                    <a href="/store.html"><i class="fa-solid fa-store"></i> Store</a>
                    <a href="/login.html"><i class="fa-solid fa-shopping-cart"></i> Cart</a>
                    <a href="/login.html"><i class="fa-solid fa-heart"></i> Wishlist</a>
                    <a href="/about.html"><i class="fa-solid fa-info-circle"></i> About</a>
                    <a href="/contact.html"><i class="fa-solid fa-envelope"></i> Contact</a>
                    <a href="/readme.html"><i class="fa-solid fa-book"></i> README</a>
                    <a href="/login.html"><i class="fa-solid fa-user"></i> Login</a>
                    <a href="/register.html"><i class="fa-solid fa-user-plus"></i> Register</a>
                `;
            }
        }

        function switchTab(tabName) {
            // hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });

            // remove active from all buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // show selected tab
            document.getElementById(`${tabName}-tab`).classList.add('active');

            // mark button as active
            event.target.classList.add('active');

            // reload data for the selected tab
            if (tabName === 'activities') {
                loadActivities();
            } else if (tabName === 'products') {
                loadProducts();
            } else if (tabName === 'dashboard') {
                loadDashboard();
            }
        }

        async function loadDashboard() {
            try {
                // load statistics
                const [activitiesRes, productsRes, usersRes] = await Promise.all([
                    fetch('/api/admin/activities'),
                    fetch('/api/products'),
                    fetch('/api/users').catch(() => ({ json: () => [] }))
                ]);

                activities = await activitiesRes.json();
                products = await productsRes.json();
                users = await usersRes.json().catch(() => []);

                // update stats
                document.getElementById('totalUsers').textContent = users.length || '3';
                document.getElementById('totalProducts').textContent = products.length;

                // count today's activities
                const today = new Date().toDateString();
                const todayActivities = activities.filter(a =>
                    new Date(a.timestamp).toDateString() === today
                ).length;
                document.getElementById('todayActivities').textContent = todayActivities;

                // calculate total sales (fake data for now)
                document.getElementById('totalSales').textContent = '₪12,345';

                // show recent activities
                displayRecentActivities(activities.slice(0, 5));

            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        function displayRecentActivities(recentActivities) {
            const container = document.getElementById('recentActivities');

            if (!recentActivities || recentActivities.length === 0) {
                container.innerHTML = '<p class="no-data">No recent activities</p>';
                return;
            }

            container.innerHTML = `
                <table class="activity-table">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>User</th>
                            <th>Activity</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${recentActivities.map(activity => `
                            <tr>
                                <td>${new Date(activity.timestamp).toLocaleString()}</td>
                                <td>${activity.username}</td>
                                <td><span class="activity-type ${activity.activity.replace(' ', '-')}">${activity.activity}</span></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        async function loadActivities() {
            try {
                const response = await fetch('/api/admin/activities');
                activities = await response.json();
                displayActivities(activities);
            } catch (error) {
                console.error('Error loading activities:', error);
                document.getElementById('activitiesContent').innerHTML =
                    '<p class="error">Failed to load activities</p>';
            }
        }

        function displayActivities(activitiesToShow) {
            const container = document.getElementById('activitiesContent');

            if (!activitiesToShow || activitiesToShow.length === 0) {
                container.innerHTML = '<p class="no-data">No activities found</p>';
                return;
            }

            container.innerHTML = `
                <table class="activity-table">
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Username</th>
                            <th>Activity Type</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${activitiesToShow.map(activity => `
                            <tr>
                                <td>${new Date(activity.timestamp).toLocaleString()}</td>
                                <td>${activity.username}</td>
                                <td><span class="activity-type ${activity.activity.replace(' ', '-')}">${activity.activity}</span></td>
                                <td>${activity.details || '-'}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function filterActivities() {
            const prefix = document.getElementById('usernameFilter').value.toLowerCase();

            if (!prefix) {
                displayActivities(activities);
                return;
            }

            const filtered = activities.filter(activity =>
                activity.username.toLowerCase().startsWith(prefix)
            );

            displayActivities(filtered);
        }

        function clearFilter() {
            document.getElementById('usernameFilter').value = '';
            displayActivities(activities);
        }

        async function loadProducts() {
            try {
                const response = await fetch('/api/products');
                products = await response.json();
                displayProducts();
            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('productsContent').innerHTML =
                    '<p class="error">Failed to load products</p>';
            }
        }

        function displayProducts() {
            const container = document.getElementById('productsContent');

            if (!products || products.length === 0) {
                container.innerHTML = '<p class="no-data">No products found</p>';
                return;
            }

            container.innerHTML = `
                <div class="products-list">
                    ${products.map(product => `
                        <div class="product-card">
                            <button class="delete-product-btn" onclick="deleteProduct(${product.id})">Delete</button>
                            ${product.image ? `<img src="${product.image}" alt="${product.name}">` : '<div style="height:150px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;border-radius:4px;">No Image</div>'}
                            <h3>${product.name}</h3>
                            <p>${product.description}</p>
                            <div class="product-price">₪${product.price.toFixed(2)}</div>
                            ${product.customizable ? '<span style="background:#ff9800;color:white;padding:2px 6px;border-radius:4px;font-size:12px;">Customizable</span>' : ''}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        document.getElementById('addProductForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const productData = {
                name: document.getElementById('productName').value,
                description: document.getElementById('productDescription').value,
                price: parseFloat(document.getElementById('productPrice').value),
                image: document.getElementById('productImage').value || null,
                customizable: document.getElementById('productCustomizable').checked
            };

            try {
                const response = await fetch('/api/admin/products', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(productData)
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('Product added successfully!');
                    document.getElementById('addProductForm').reset();
                    await loadProducts();
                } else {
                    showError('Failed to add product');
                }
            } catch (error) {
                console.error('Error adding product:', error);
                showError('Failed to add product');
            }
        });

        async function deleteProduct(productId) {
            if (!confirm('Are you sure you want to delete this product?')) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/products/${productId}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('Product deleted successfully!');
                    await loadProducts();
                } else {
                    showError('Failed to delete product');
                }
            } catch (error) {
                console.error('Error deleting product:', error);
                showError('Failed to delete product');
            }
        }

        async function logout() {
            try {
                const response = await fetch('/logout', {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    window.location.reload();
                }
            } catch (error) {
                console.error('Logout error:', error);
            }
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
