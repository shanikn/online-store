<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>Admin Panel - ShanikJewels</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="/styles/theme.css">
</head>
<body>
    <!-- Header with navigation -->
    <div class="header-shell">
        <div class="announcement-bar">
            <span class="announcement-pill"><i class="fa-solid fa-shield-halved"></i> Admin Panel</span>
            <span>Manage your store products and monitor user activity.</span>
            <button type="button" class="announcement-action" onclick="window.location.href='/store.html'">View Store <i class="fa-solid fa-arrow-right"></i></button>
        </div>

        <div class="header">
            <button class="menu" id="menu" onclick="toggleMenu()" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
            <div class="brand">
                <h1>ShanikJewels</h1>
                <span class="brand-tagline">Admin Dashboard</span>
            </div>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle dark mode">
                    <span id="themeIcon">🌙</span>
                    <span id="themeText">OFF</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Side menu -->
    <div class="menu-overlay" id="menuOverlay"></div>
    <nav class="side-menu" id="sideMenu">
        <!-- Dynamic navigation will be populated by JavaScript -->
    </nav>

    <div class="admin-container">
        <div id="successMessage" class="success"></div>
        <div id="errorMessage" class="error" style="display: none;"></div>

        <div class="admin-tabs">
            <button class="tab-btn active" onclick="switchTab('activities')">Activity Logs</button>
            <button class="tab-btn" onclick="switchTab('products')">Product Management</button>
        </div>

        <!-- Activities Tab -->
        <div id="activities-tab" class="tab-content active">
            <h2>User Activity Logs</h2>
            
            <!-- Registered Users Section -->
            <div class="users-section" style="margin-bottom: 2rem; padding: 1rem; background: var(--surface-color, #fff); border-radius: 12px;">
                <h3 style="margin-bottom: 1rem;">Registered Users</h3>
                <div id="usersListContainer" style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
                    <div class="loading">Loading users...</div>
                </div>
            </div>

            <div class="filter-section">
                <input type="text" id="usernameFilter" placeholder="Filter by username prefix..." oninput="filterActivities()">
                <button onclick="clearFilter()">Clear</button>
            </div>
            <div id="activitiesContent">
                <div class="loading">Loading activities...</div>
            </div>
        </div>

        <!-- Products Tab -->
        <div id="products-tab" class="tab-content">
            <h2>Product Management</h2>

            <div class="product-form">
                <h3>Add New Product</h3>
                <form id="addProductForm">
                    <div class="form-group">
                        <label for="productName">Product Name *</label>
                        <input type="text" id="productName" required>
                    </div>
                    <div class="form-group">
                        <label for="productDescription">Description *</label>
                        <textarea id="productDescription" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="productPrice">Price (₪) *</label>
                        <input type="number" id="productPrice" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="productCategory">Product Category *</label>
                        <select id="productCategory" required class="form-select">
                            <option value="">Select Product Type</option>
                            <option value="earrings">Earrings</option>
                            <option value="bracelets">Bracelets</option>
                            <option value="necklaces">Necklaces</option>
                            <option value="rings">Rings</option>
                            <option value="watches">Watches</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="productImage">Image URL</label>
                        <input type="url" id="productImage" placeholder="https://example.com/image.jpg">
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="productCustomizable">
                            Customizable Product
                        </label>
                    </div>
                    <button type="submit" class="add-product-btn">Add Product</button>
                </form>
            </div>

            <h3>Current Products</h3>
            <div id="productsContent">
                <div class="loading">Loading products...</div>
            </div>
        </div>
    </div>

    <!-- Include layout.js for shared functionality -->
    <script src="/scripts/layout.js"></script>

    <script>
        let activities = [];
        let products = [];
        let users = [];

        document.addEventListener('DOMContentLoaded', function() {
            initializeBaseLayout();
            checkAdminAccess();

            // Load all data first
            loadUsers();
            loadActivities();
            loadProducts();

            // Then restore last active tab or default to activities
            const savedTab = localStorage.getItem('adminActiveTab') || 'activities';

            // Just switch the visual tab, don't reload data
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.onclick && btn.onclick.toString().includes(savedTab)) {
                    btn.classList.add('active');
                }
            });
            document.getElementById(`${savedTab}-tab`).classList.add('active');
        });

        async function checkAdminAccess() {
            // Check if user is admin (you can enhance this with actual server check)
            try {
                const response = await fetch('/api/products');
                if (!response.ok && response.status === 401) {
                    window.location.href = '/login.html';
                }
            } catch (error) {
                console.error('Access check failed:', error);
            }
        }

        function switchTab(tabName, skipSave = false) {
            // hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });

            // remove active from all buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // show selected tab
            document.getElementById(`${tabName}-tab`).classList.add('active');

            // mark button as active
            if (event && event.target) {
                event.target.classList.add('active');
            } else {
                // Find and activate the correct button when called without event
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    if (btn.onclick && btn.onclick.toString().includes(tabName)) {
                        btn.classList.add('active');
                    }
                });
            }

            // Save active tab to localStorage unless skipping (on initial load)
            if (!skipSave) {
                localStorage.setItem('adminActiveTab', tabName);
            }

            // reload data for the selected tab
            if (tabName === 'activities') {
                loadUsers();
                loadActivities();
            } else if (tabName === 'products') {
                loadProducts();
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/users').catch(() =>
                    fetch('/api/users').catch(() => ({ ok: false }))
                );

                if (response.ok) {
                    users = await response.json();
                } else {
                    // Fallback: extract unique usernames from activities
                    // First ensure activities are loaded
                    if (!activities || activities.length === 0) {
                        try {
                            const activitiesResponse = await fetch('/api/admin/activities');
                            if (activitiesResponse.ok) {
                                activities = await activitiesResponse.json();
                            }
                        } catch (actError) {
                            console.error('Error loading activities for user fallback:', actError);
                        }
                    }

                    if (activities && activities.length > 0) {
                        const uniqueUsernames = [...new Set(activities.map(a => a.username))];
                        users = uniqueUsernames.map(username => ({ username }));
                    } else {
                        users = [];
                    }
                }
                displayUsers();
            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('usersListContainer').innerHTML =
                    '<p class="error">Failed to load users</p>';
            }
        }

        function displayUsers() {
            const container = document.getElementById('usersListContainer');

            if (!users || users.length === 0) {
                container.innerHTML = '<p class="no-data">No users found</p>';
                return;
            }

            container.innerHTML = users.map(user => `
                <span style="display: inline-block; padding: 0.5rem 1rem; background: var(--accent-color, #b8977c); color: white; border-radius: 20px; font-size: 0.9rem;">
                    <i class="fa-solid fa-user" style="margin-right: 0.5rem;"></i>${user.username}
                </span>
            `).join('');
        }

        async function loadActivities() {
            try {
                const response = await fetch('/api/admin/activities');
                activities = await response.json();
                displayActivities(activities);
            } catch (error) {
                console.error('Error loading activities:', error);
                document.getElementById('activitiesContent').innerHTML =
                    '<p class="error">Failed to load activities</p>';
            }
        }

        function displayActivities(activitiesToShow) {
            const container = document.getElementById('activitiesContent');

            if (!activitiesToShow || activitiesToShow.length === 0) {
                container.innerHTML = '<p class="no-data">No activities found</p>';
                return;
            }

            container.innerHTML = `
                <table class="activity-table">
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Username</th>
                            <th>Activity Type</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${activitiesToShow.map(activity => `
                            <tr>
                                <td>${new Date(activity.timestamp).toLocaleTimeString('he-IL', {
                                    hour: '2-digit',
                                    minute: '2-digit',
                                    hour12: false
                                })} ${new Date(activity.timestamp).toLocaleDateString('he-IL', {
                                    day: '2-digit',
                                    month: '2-digit',
                                    year: 'numeric'
                                })}</td>
                                <td>${activity.username}</td>
                                <td><span class="activity-type ${activity.type.replace(' ', '-').toLowerCase()}">${activity.type}</span></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function filterActivities() {
            const prefix = document.getElementById('usernameFilter').value.toLowerCase();

            if (!prefix) {
                displayActivities(activities);
                return;
            }

            const filtered = activities.filter(activity =>
                activity.username.toLowerCase().startsWith(prefix)
            );

            displayActivities(filtered);
        }

        function clearFilter() {
            document.getElementById('usernameFilter').value = '';
            displayActivities(activities);
        }

        async function loadProducts() {
            try {
                const response = await fetch('/api/products');
                products = await response.json();
                displayProducts();
            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('productsContent').innerHTML =
                    '<p class="error">Failed to load products</p>';
            }
        }

        function displayProducts() {
            const container = document.getElementById('productsContent');

            if (!products || products.length === 0) {
                container.innerHTML = '<p class="no-data">No products found</p>';
                return;
            }

            container.innerHTML = `
                <div class="products-list">
                    ${products.map(product => `
                        <div class="product-card">
                            <button class="delete-product-btn" onclick="deleteProduct(${product.id})">Delete</button>
                            ${product.image ? `<img src="${product.image}" alt="${product.name}">` : '<div style="height:200px;background:#f5f0ed;display:flex;align-items:center;justify-content:center;border-radius:12px;color:#a39891;">No Image</div>'}
                            <h3>${product.name}</h3>
                            <p>${product.description}</p>
                            <div class="product-price">₪${product.price.toFixed(2)}</div>
                            ${product.customizable ? '<span class="customizable-badge">Customizable</span>' : ''}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        document.getElementById('addProductForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const productData = {
                name: document.getElementById('productName').value,
                description: document.getElementById('productDescription').value,
                price: parseFloat(document.getElementById('productPrice').value),
                category: document.getElementById('productCategory').value,
                image: document.getElementById('productImage').value || null,
                customizable: document.getElementById('productCustomizable').checked
            };

            try {
                const response = await fetch('/api/admin/products', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(productData)
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('Product added successfully!');
                    document.getElementById('addProductForm').reset();
                    await loadProducts();
                } else {
                    showError('Failed to add product');
                }
            } catch (error) {
                console.error('Error adding product:', error);
                showError('Failed to add product');
            }
        });

        async function deleteProduct(productId) {
            if (!confirm('Are you sure you want to delete this product?')) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/products/${productId}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('Product deleted successfully!');
                    await loadProducts();
                } else {
                    showError('Failed to delete product');
                }
            } catch (error) {
                console.error('Error deleting product:', error);
                showError('Failed to delete product');
            }
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
