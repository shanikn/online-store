<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>My Wishlist - ShanikJewls</title>
    <!-- Font Awesome for icons <3 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="/styles/theme.css">
</head>
<body>
    <!-- header with navigation -->
    <div class="header-shell">
        <div class="announcement-bar">
            <span class="announcement-pill"><i class="fa-solid fa-heart"></i> My Wishlist</span>
            <span>Your saved jewelry pieces, waiting to be yours.</span>
            <button type="button" class="announcement-action" onclick="window.location.href='/store.html'">Continue Shopping <i class="fa-solid fa-arrow-right"></i></button>
        </div>
        <div class="header">
            <button class="menu" id="menu" onclick="toggleMenu()" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
            <div class="brand">
                <h1>ShanikJewls</h1>
                <span class="brand-tagline">Handcrafted Jewelry</span>
            </div>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle dark mode">
                    <span id="themeIcon">🌙</span>
                    <span id="themeText">OFF</span>
                </button>
            </div>
        </div>
    </div>

    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <!-- Dynamic navigation will be populated by JavaScript -->
    </div>

    <main class="page-frame">
        <div id="successMessage" class="success"></div>
        <div id="errorMessage" class="error"></div>

        <section class="page-hero">
            <div class="page-hero__content">
                <h1 class="page-hero__title">My Wishlist</h1>
                <p class="page-hero__copy">All your favorite jewelry pieces, saved for when you're ready to make them yours.</p>
            </div>
        </section>

        <div id="loading" class="loading">Loading your wishlist...</div>

        <div id="wishlistContent" style="display: none;">
            <div class="wishlist-header">
                <div class="wishlist-stats">
                    <span id="wishlistCount">0</span> items saved
                </div>
            </div>

            <div id="wishlistItems" class="wishlist-grid"></div>
        </div>
    </main>

    <style>
        /* Wishlist-specific styles */
        .header-shell, .announcement-bar {
            border-bottom: none;
        }

        .wishlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 40px 0 20px;
        }
        
        .wishlist-stats {
            color: #7a6c5d;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin: 40px 0;
        }
        
        .wishlist-item {
            position: relative;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 18px 36px rgba(52, 41, 32, 0.1);
            border: 1px solid rgba(162, 150, 138, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .wishlist-item:hover {
            transform: translateY(-6px);
            box-shadow: 0 24px 48px rgba(52, 41, 32, 0.15);
        }
        
        .heart-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #e96a8d;
            font-size: 1.2rem;
            z-index: 2;
        }
        
        .item-image {
            width: 100%;
            aspect-ratio: 4/5;
            background: linear-gradient(135deg, #f5f1ec 0%, #e7dfd6 100%);
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .item-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #3f362f;
            margin-bottom: 8px;
            font-family: 'Fraunces', serif;
        }
        
        .item-description {
            color: #7a6c5d;
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 12px;
        }
        
        .item-price {
            font-size: 1.2rem;
            font-weight: 600;
            color: #7d514b;
            margin-bottom: 20px;
        }
        
        .item-actions {
            display: flex;
            gap: 12px;
        }
        
        .add-to-cart-btn {
            flex: 1;
            background: #7d514b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .add-to-cart-btn:hover {
            background: #6b463f;
            transform: translateY(-2px);
        }
        
        .remove-btn {
            background: none;
            border: none;
            color: #d32f2f;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .remove-btn:hover {
            background: rgba(211, 47, 47, 0.1);
        }
        
        .empty-wishlist {
            text-align: center;
            padding: 80px 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 18px 36px rgba(52, 41, 32, 0.1);
        }
        
        .browse-btn {
            background: #7d514b;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        
        .browse-btn:hover {
            background: #6b463f;
            transform: translateY(-2px);
        }
        
        /* Dark mode styles */
        body.dark-mode .wishlist-item,
        body.dark-mode .empty-wishlist {
            background: rgba(32, 29, 27, 0.95);
            border-color: rgba(130, 116, 102, 0.35);
        }
        
        body.dark-mode .item-name {
            color: #e8ded2;
        }
        
        body.dark-mode .item-description {
            color: #b8a690;
        }
        
        body.dark-mode .item-price {
            color: #d4a574;
        }
        
        body.dark-mode .add-to-cart-btn {
            background: #a67c79;
        }
        
        body.dark-mode .add-to-cart-btn:hover {
            background: #b8908d;
        }

        body.dark-mode .remove-btn {
            color: #ff6b6b;
        }

        body.dark-mode .remove-btn:hover {
            background: rgba(255, 107, 107, 0.15);
        }
    </style>

    <script src="/scripts/layout.js"></script>
    <script>
        let wishlistItems = [];
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('Wishlist DOM loaded - initializing...');

            // Initialize layout first (this should populate the side menu)
            try {
                console.log('Calling initializeBaseLayout()...');
                initializeBaseLayout();
                console.log('initializeBaseLayout() completed');
            } catch (error) {
                console.error('Error in initializeBaseLayout:', error);
            }

            // Add a small delay to let authentication check complete
            await new Promise(resolve => setTimeout(resolve, 50));

            // Load wishlist data (with fallback demo data)
            try {
                console.log('Calling loadWishlist()...');
                await loadWishlistWithFallback();
            } catch (error) {
                console.error('Error calling loadWishlist:', error);
                // Show demo data if API fails
                showDemoWishlist();
            }

            // IMMEDIATE FALLBACK - Force show demo wishlist after a very short delay
            setTimeout(() => {
                const loadingElement = document.getElementById('loading');
                const contentElement = document.getElementById('wishlistContent');
                
                if (loadingElement && loadingElement.style.display !== 'none' &&
                    contentElement && contentElement.style.display === 'none') {
                    console.log('⚡ IMMEDIATE FALLBACK: Showing demo wishlist now!');
                    showDemoWishlist();
                }
            }, 100);
        });


        async function loadWishlistWithFallback() {
            try {
                const response = await fetch('/api/wishlist');
                if (response.ok) {
                    wishlistItems = await response.json();
                    
                    // If wishlist is empty, show demo data for now
                    if (!wishlistItems || wishlistItems.length === 0) {
                        console.log('Wishlist empty, showing demo data');
                        showDemoWishlist();
                        return;
                    }
                    
                    displayWishlist();
                    finishLoading();
                } else if (response.status === 401) {
                    window.location.href = '/login.html';
                    return;
                } else {
                    throw new Error('Failed to load wishlist');
                }
            } catch (error) {
                console.error('Error loading wishlist:', error);
                showDemoWishlist(); // Fallback to demo
            }
        }

        function showDemoWishlist() {
            console.log('🎯 SHOWING DEMO WISHLIST');
            // Demo wishlist with a few popular items
            wishlistItems = [
                {
                    id: 1,
                    name: "Delicate Gold Chain Necklace",
                    description: "A timeless 14k gold chain perfect for layering or wearing alone.",
                    price: 189.99,
                    image: "https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
                },
                {
                    id: 5,
                    name: "Layered Chain Necklace Set",
                    description: "Three complementary chains that layer beautifully together.",
                    price: 299.99,
                    image: "https://images.unsplash.com/photo-1506630448388-4e683c67ddb0?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
                },
                {
                    id: 9,
                    name: "Minimalist Gold Ring Set",
                    description: "Set of three stackable rings in different textures.",
                    price: 149.99,
                    image: "https://images.unsplash.com/photo-1605100804763-247f67b3557e?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
                }
            ];
            
            console.log('✅ Demo wishlist created with', wishlistItems.length, 'items');
            displayWishlist();
            finishLoading();
            console.log('✅ Demo wishlist display completed');
        }
        
        function finishLoading() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('wishlistContent').style.display = 'block';
        }

        // Keep the old function for backward compatibility
        async function loadWishlist() {
            return loadWishlistWithFallback();
        }

        function displayWishlist() {
            console.log('🎨 DISPLAYING WISHLIST with', wishlistItems ? wishlistItems.length : 0, 'items');
            
            const container = document.getElementById('wishlistItems');
            const countElement = document.getElementById('wishlistCount');

            if (!container) {
                console.error('❌ wishlistItems container not found!');
                return;
            }

            if (!countElement) {
                console.error('❌ wishlistCount element not found!');
                return;
            }

            countElement.textContent = wishlistItems ? wishlistItems.length : 0;

            if (!wishlistItems || wishlistItems.length === 0) {
                console.log('📭 Empty wishlist - showing empty state');
                container.innerHTML = `
                    <div class="empty-wishlist" style="grid-column: 1 / -1;">
                        <h2>Your wishlist is empty</h2>
                        <p>Save items you love to your wishlist and come back to them later!</p>
                        <a href="/store.html" class="browse-btn">Browse Store</a>
                    </div>
                `;
                return;
            }

            console.log('🏗️ Building wishlist HTML for', wishlistItems.length, 'items');
            
            const htmlContent = wishlistItems.map(item => {
                // Products that need better positioning (no cropping of jewelry)
                const customPositions = {
                    1: 'object-position: center 80%;', // Delicate Gold Chain Necklace - moved a bit lower
                    2: 'object-position: center 80%;', // Minimalist Gold Hoop Earrings - moved a lot lower
                    5: 'object-position: center 15%;', // Layered Chain Necklace Set - show necklaces
                    9: 'object-position: center 70%;', // Minimalist Gold Ring Set - moved a bit lower
                    12: 'object-position: center 60%;', // Gold Chain Bracelet - moved a bit lower
                    13: 'object-position: center 30%;', // Twisted Gold Ring - moved a bit higher
                    15: 'object-position: center 40%;' // Gold Vintage Ring - moved a bit higher
                };

                const imageStyle = customPositions[item.id] ?
                    `style="width: 100%; height: 100%; object-fit: cover; ${customPositions[item.id]}"` :
                    'style="width: 100%; height: 100%; object-fit: cover; object-position: center;"';

                return `
                <div class="wishlist-item">
                    <div class="heart-icon"><i class="fa-solid fa-heart"></i></div>
                    <div class="item-image">
                        ${item.image ? `<img src="${item.image}" alt="${item.name}" ${imageStyle}>` : 'No image available'}
                    </div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-description">${item.description || ''}</div>
                    <div class="item-price">₪${item.price.toFixed(2)}</div>
                    <div class="item-actions">
                        <button class="add-to-cart-btn" onclick="addToCart(${item.id})">Add to Cart</button>
                        <button class="remove-btn" onclick="removeFromWishlist(${item.id})" title="Remove from wishlist">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
                `;
            }).join('');

            container.innerHTML = htmlContent;
            console.log('✅ Wishlist HTML set successfully');
        }

        async function addToCart(productId) {
            try {
                const response = await fetch('/api/cart/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ productId: productId })
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('Item added to cart!');
                } else {
                    showError('Failed to add item to cart');
                }
            } catch (error) {
                console.error('Error adding item to cart:', error);
                showError('Connection error. Please try again.');
            }
        }

        async function removeFromWishlist(productId) {
            if (!confirm('Remove this item from your wishlist?')) {
                return;
            }

            try {
                // Use real API endpoint - matching the format used in store.html and collections
                const response = await fetch('/api/wishlist/remove', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({productId: productId})
                });

                // Handle authentication required response
                if (response.status === 401 || response.redirected && response.url.includes('login')) {
                    alert('Please login to manage your wishlist');
                    window.location.href = '/login.html';
                    return;
                }

                const data = await response.json();
                if (data.success) {
                    // Reload wishlist from server to ensure consistency
                    await loadWishlist();
                    showSuccess('Item removed from wishlist');

                    // Update badge counts if function exists
                    if(typeof updateCartAndWishlistCounts === 'function'){
                        updateCartAndWishlistCounts();
                    }
                } else {
                    showError('Failed to remove item from wishlist');
                }
            } catch (error) {
                console.error('Error removing item from wishlist:', error);
                showError('Failed to remove item from wishlist');
            }
        }


        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
