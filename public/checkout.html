<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>Checkout</title>
    <!-- Font Awesome for icons <3 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
        }

        .header {
            background: none;
            color: black;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .header h1 {
            margin: 0;
        }

        .menu {
            position: fixed;
            top: 35px;
            left: 20px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
            z-index: 1002;
        }

        .menu span {
            display: block;
            width: 25px;
            height: 3px;
            background: black;
            margin: 3px 0;
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100vh;
            background: green;
            transition: left 0.3s ease;
            z-index: 1000;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            overflow-y: auto;
            padding-top: 80px;
        }

        .side-menu.active {
            left: 0;
        }

        .side-menu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 20px 15px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: background 0.3s;
        }

        .side-menu a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .side-menu button {
            width: calc(100% - 40px);
            margin: 15px 20px 15px 40px;
            background: gray;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 999;
        }

        .menu-overlay.active {
            display: block;
        }

        .checkout-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .checkout-form {
            background: white;
            border-radius: 8px;
            padding: 30px;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-section h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: green;
            outline: none;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .order-summary {
            background: white;
            border-radius: 8px;
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #333;
        }

        .place-order-btn {
            width: 100%;
            background: green;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            margin-top: 20px;
        }

        .place-order-btn:hover {
            background: darkgreen;
        }

        .place-order-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .success {
            background: #4CAF50;
            color: white;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .error {
            background: #f44336;
            color: white;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .empty-cart {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 8px;
            grid-column: 1 / -1;
        }

        .cart-item-mini {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .item-qty {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="menu" id="menu" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <h1>Checkout</h1>
    </div>

    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <!-- Dynamic navigation will be populated by JavaScript -->
    </div>

    <div id="successMessage" class="success"></div>
    <div id="errorMessage" class="error"></div>

    <div id="loading" class="loading">Loading checkout...</div>

    <div class="checkout-container" id="checkoutContent" style="display: none;">
        <div class="checkout-form">
            <form id="checkoutForm">
                <div class="form-section">
                    <h2>Shipping Information</h2>
                    <div class="form-group">
                        <label for="fullName">Full Name *</label>
                        <input type="text" id="fullName" name="fullName" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label for="address">Street Address *</label>
                        <input type="text" id="address" name="address" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City *</label>
                            <input type="text" id="city" name="city" required>
                        </div>
                        <div class="form-group">
                            <label for="zipCode">ZIP Code *</label>
                            <input type="text" id="zipCode" name="zipCode" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="country">Country *</label>
                        <select id="country" name="country" required>
                            <option value="">Select Country</option>
                            <option value="Israel">Israel</option>
                            <option value="USA">United States</option>
                            <option value="UK">United Kingdom</option>
                            <option value="Canada">Canada</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Payment Information</h2>
                    <div class="form-group">
                        <label for="cardName">Cardholder Name *</label>
                        <input type="text" id="cardName" name="cardName" required>
                    </div>
                    <div class="form-group">
                        <label for="cardNumber">Card Number *</label>
                        <input type="text" id="cardNumber" name="cardNumber" pattern="[0-9]{16}" maxlength="16" placeholder="1234 5678 9012 3456" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="expiry">Expiry Date *</label>
                            <input type="text" id="expiry" name="expiry" placeholder="MM/YY" pattern="[0-9]{2}/[0-9]{2}" maxlength="5" required>
                        </div>
                        <div class="form-group">
                            <label for="cvv">CVV *</label>
                            <input type="text" id="cvv" name="cvv" pattern="[0-9]{3}" maxlength="3" placeholder="123" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="place-order-btn">Place Order</button>
            </form>
        </div>

        <div class="order-summary">
            <h2>Order Summary</h2>
            <div id="orderItems"></div>
            <div class="summary-total">
                <span>Total:</span>
                <span id="orderTotal">�0.00</span>
            </div>
        </div>
    </div>

    <script>
        let cartItems = [];
        let orderTotal = 0;
        let isAuthenticated = false;

        document.addEventListener('DOMContentLoaded', function() {
            checkAuthStatus();
            loadCart();
        });

        function toggleMenu() {
            const menu = document.getElementById('menu');
            const sideMenu = document.getElementById('sideMenu');
            const overlay = document.getElementById('menuOverlay');

            menu.classList.toggle('active');
            sideMenu.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        async function checkAuthStatus(){
            try{
                const response = await fetch('/api/users/current');
                isAuthenticated = response.ok;
                updateNavigation();
            } catch(error){
                isAuthenticated = false;
                updateNavigation();
            }
        }

        function updateNavigation(){
            const sideMenu = document.getElementById('sideMenu');

            if(isAuthenticated){
                sideMenu.innerHTML = `
                    <a href="/store.html"><i class="fa-solid fa-store"></i> Store</a>
                    <a href="/cart.html"><i class="fa-solid fa-shopping-cart"></i> Cart</a>
                    <a href="/wishlist.html"><i class="fa-solid fa-heart"></i> Wishlist</a>
                    <a href="/about.html"><i class="fa-solid fa-info-circle"></i> About</a>
                    <a href="/contact.html"><i class="fa-solid fa-envelope"></i> Contact</a>
                    <a href="/profile.html"><i class="fa-solid fa-user"></i> Profile</a>
                    <a href="/admin.html"><i class="fa-solid fa-cog"></i> Admin</a>
                    <button onclick="logout()"><i class="fa-solid fa-sign-out-alt"></i> Logout</button>
                `;
            } else {
                sideMenu.innerHTML = `
                    <a href="/store.html"><i class="fa-solid fa-store"></i> Store</a>
                    <a href="/login.html"><i class="fa-solid fa-shopping-cart"></i> Cart</a>
                    <a href="/login.html"><i class="fa-solid fa-heart"></i> Wishlist</a>
                    <a href="/about.html"><i class="fa-solid fa-info-circle"></i> About</a>
                    <a href="/contact.html"><i class="fa-solid fa-envelope"></i> Contact</a>
                    <a href="/readme.html"><i class="fa-solid fa-book"></i> README</a>
                    <a href="/login.html"><i class="fa-solid fa-user"></i> Login</a>
                    <a href="/register.html"><i class="fa-solid fa-user-plus"></i> Register</a>
                `;
            }
        }

        async function loadCart() {
            try {
                const response = await fetch('/api/cart');
                if (!response.ok) {
                    throw new Error('Failed to load cart');
                }

                cartItems = await response.json();

                if (!cartItems || cartItems.length === 0) {
                    showEmptyCart();
                } else {
                    displayOrderSummary();
                    document.getElementById('checkoutContent').style.display = 'grid';
                }
            } catch (error) {
                console.error('Error loading cart:', error);
                showError('Failed to load cart');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function showEmptyCart() {
            document.getElementById('checkoutContent').innerHTML = `
                <div class="empty-cart">
                    <h2>Your cart is empty</h2>
                    <p>Add items to your cart before checking out</p>
                    <button class="place-order-btn" onclick="window.location.href='/store.html'">Go to Store</button>
                </div>
            `;
            document.getElementById('checkoutContent').style.display = 'block';
        }

        function displayOrderSummary() {
            const itemsContainer = document.getElementById('orderItems');
            orderTotal = 0;

            itemsContainer.innerHTML = cartItems.map(item => {
                const itemTotal = item.price * item.quantity;
                orderTotal += itemTotal;
                return `
                    <div class="cart-item-mini">
                        <span>${item.name} <span class="item-qty">x${item.quantity}</span></span>
                        <span>�${itemTotal.toFixed(2)}</span>
                    </div>
                `;
            }).join('');

            document.getElementById('orderTotal').textContent = `�${orderTotal.toFixed(2)}`;
        }

        document.getElementById('checkoutForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = e.target.querySelector('.place-order-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';

            const formData = {
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                city: document.getElementById('city').value,
                zipCode: document.getElementById('zipCode').value,
                country: document.getElementById('country').value,
                cardName: document.getElementById('cardName').value,
                cardNumber: document.getElementById('cardNumber').value,
                expiry: document.getElementById('expiry').value,
                cvv: document.getElementById('cvv').value,
                items: cartItems,
                total: orderTotal
            };

            try {
                const response = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('Order placed successfully! Redirecting...');
                    setTimeout(() => {
                        window.location.href = '/store.html';
                    }, 2000);
                } else {
                    showError(data.message || 'Failed to place order');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Place Order';
                }
            } catch (error) {
                console.error('Error placing order:', error);
                showError('Connection error. Please try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Place Order';
            }
        });

        // Format card number input
        document.getElementById('cardNumber').addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        // format expiry date input
        document.getElementById('expiry').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.slice(0, 2) + '/' + value.slice(2, 4);
            }
            e.target.value = value;
        });

        // format CVV input
        document.getElementById('cvv').addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        async function logout() {
            try {
                const response = await fetch('/logout', {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    window.location.reload();
                }
            } catch (error) {
                console.error('Logout error:', error);
            }
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
