<!DOCTYPE html>
<html>
<head>
    <title>Force Close Menu</title>
</head>
<body>
    <h1>Force Close Menu</h1>
    <button onclick="forceCloseMenu()">Force Close Menu</button>
    <br><br>
    <a href="/store.html">Go to Store</a> |
    <a href="/profile.html">Go to Profile</a> |
    <a href="/admin.html">Go to Admin</a>

    <script>
        function forceCloseMenu() {
            // Force remove active classes from menu elements
            const menu = document.getElementById('menu');
            const sideMenu = document.getElementById('sideMenu');
            const overlay = document.getElementById('menuOverlay');

            if (menu) menu.classList.remove('active');
            if (sideMenu) sideMenu.classList.remove('active');
            if (overlay) overlay.classList.remove('active');

            // Also try to find elements by class
            const activeMenus = document.querySelectorAll('.side-menu.active');
            const activeOverlays = document.querySelectorAll('.menu-overlay.active');
            const activeButtons = document.querySelectorAll('.menu.active');

            activeMenus.forEach(el => el.classList.remove('active'));
            activeOverlays.forEach(el => el.classList.remove('active'));
            activeButtons.forEach(el => el.classList.remove('active'));

            alert('Menu forced closed! Try navigating now.');
        }
    </script>
</body>
</html>
